<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Closed CRAS — referência responsiva</title>
<!--
  Referência visual das classes compact / medium / expanded.
  Spines (DESIGN.md, EXPERIENCE.md) vencem em conflito.
  Rotas: #/login  #/login?erro=401  #/home?nav=open  #/salas  #/salas?dialog=nova
         #/salas/b201  #/turmas/se-a?aba=aulas|alunos|reservas  #/alunos?erro=503
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Code+Pro:wght@500&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=block" rel="stylesheet">
<style>
  :root {
    --background: #F5F8FC;
    --on-surface: #0A2540;
    --on-surface-variant: #4A5568;
    --primary: #0066B3;
    --on-primary: #FFFFFF;
    --primary-container: #D0E5F4;
    --on-primary-container: #00386B;
    --secondary: #0A2540;
    --tertiary: #6DCDF6;
    --tertiary-container: #E5F6FD;
    --on-tertiary-container: #063A55;
    --gold: #C4A035;
    --gold-container: #F7EBC7;
    --on-gold-container: #4A3A00;
    --outline: #C5D0DE;
    --outline-variant: #E8EEF5;
    --surface-lowest: #FFFFFF;
    --surface-low: #EEF3F8;
    --surface-container: #E4EBF3;
    --surface-high: #D8E2EC;
    --error: #B1101A;
    --error-container: #FDECEC;
    --occ-free: #E7F3EC;
    --occ-taken: #E8EEF5;
    --occ-exception: #E5F6FD;
    --page: 24px;
    --gutter: 24px;
    --sidebar: 280px;
    --touch: 48px;
    --font: 'Source Sans 3', system-ui, sans-serif;
    --mono: 'Source Code Pro', ui-monospace, monospace;
  }
  @media (max-width: 599px) {
    :root { --page: 16px; --gutter: 16px; }
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    font: 400 14px/20px var(--font);
    color: var(--on-surface);
    background: var(--background);
    -webkit-font-smoothing: antialiased;
  }
  h1, h2, h3, p { margin: 0; }
  button { font: inherit; color: inherit; }
  .ms {
    font-family: 'Material Symbols Outlined';
    font-size: 24px; line-height: 1; font-weight: normal;
    display: inline-block; width: 24px; overflow: hidden;
    -webkit-font-feature-settings: 'liga'; font-feature-settings: 'liga';
  }
  .mono { font-family: var(--mono); font-size: 13px; }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
  :focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
  [tabindex="-1"]:focus { outline: none; }

  /* ---------- Buttons (M3, 40dp visual) ---------- */
  .btn {
    height: 40px; padding: 0 24px; border-radius: 20px; border: 0;
    font-weight: 600; display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    cursor: pointer; white-space: nowrap; position: relative; background: none; text-decoration: none;
  }
  .btn .ms { font-size: 18px; width: 18px; }
  .btn-filled { background: var(--primary); color: var(--on-primary); }
  .btn-outlined { border: 1px solid var(--outline); color: var(--primary); background: var(--surface-lowest); }
  .btn-text { padding: 0 12px; color: var(--primary); }
  .btn-text.neutral { color: var(--on-surface); }
  .btn-text.danger { color: var(--error); }
  .icon-btn {
    width: 40px; height: 40px; border-radius: 20px; border: 0; background: none; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center; color: var(--on-surface-variant);
    position: relative; flex: none;
  }
  .icon-btn:hover, .btn-text:hover { background: rgba(0,102,179,.08); }
  /* Área de toque 48 sem crescer o visual (compact e medium) */
  @media (max-width: 1023px) {
    .icon-btn::after, .btn::after { content: ''; position: absolute; inset: -4px; }
  }

  /* ---------- App bar ---------- */
  .appbar {
    height: 64px; background: var(--surface-lowest); display: flex; align-items: center; gap: 12px;
    padding: 0 8px 0 12px; box-shadow: 0 1px 2px rgba(10,37,64,.12); position: sticky; top: 0; z-index: 20;
  }
  .appbar-stripe { height: 4px; background: var(--tertiary); position: sticky; top: 64px; z-index: 20; }
  .brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
  .brand-mark {
    width: 40px; height: 40px; border-radius: 12px; background: var(--primary-container);
    display: grid; place-items: center; flex: none;
  }
  .brand-mark span { width: 20px; height: 20px; border-radius: 6px; background: var(--primary); display: block; transform: rotate(45deg); }
  .brand-name { font-weight: 700; font-size: 18px; line-height: 22px; color: var(--primary); white-space: nowrap; }
  .brand-caption { font-size: 12px; line-height: 16px; color: var(--on-surface-variant); }
  .appbar-spacer { flex: 1; }
  .user { display: flex; align-items: center; gap: 8px; }
  .user-name { font-weight: 600; white-space: nowrap; }
  .user-role { color: var(--on-surface-variant); }
  .avatar {
    width: 32px; height: 32px; border-radius: 16px; background: var(--secondary); color: #fff;
    display: grid; place-items: center; font-weight: 600; font-size: 13px; flex: none;
  }
  @media (max-width: 599px) {
    .brand-caption, .user-name { display: none; }
    .appbar { gap: 8px; padding-left: 8px; }
    .brand { gap: 8px; }
  }

  /* ---------- Shell ---------- */
  .shell { display: flex; min-height: calc(100vh - 68px); }
  .drawer {
    width: var(--sidebar); flex: none; background: var(--surface-lowest);
    border-right: 1px solid var(--outline-variant); padding: 12px;
  }
  .drawer-head { display: none; align-items: center; justify-content: space-between; padding: 4px 4px 8px 16px; }
  .drawer-label { font-size: 12px; font-weight: 600; color: var(--on-surface-variant); padding: 12px 16px 8px; text-transform: uppercase; letter-spacing: .04em; }
  .nav-item {
    height: 56px; display: flex; align-items: center; gap: 12px; padding: 0 16px; border-radius: 28px;
    color: var(--on-surface); text-decoration: none; font-weight: 600; position: relative;
  }
  .nav-item .ms { color: var(--on-surface-variant); }
  .nav-item:hover { background: var(--surface-low); }
  .nav-item[aria-current="page"] { background: var(--primary-container); color: var(--on-primary-container); }
  .nav-item[aria-current="page"] .ms { color: var(--primary); }
  .nav-item[aria-current="page"]::before {
    content: ''; position: absolute; left: 0; top: 16px; bottom: 16px; width: 4px; border-radius: 2px; background: var(--primary);
  }
  .scrim { display: none; }
  main { flex: 1; min-width: 0; padding: var(--page); }

  @media (max-width: 1023px) {
    .drawer {
      position: fixed; top: 0; bottom: 0; left: 0; z-index: 40; transform: translateX(-100%);
      transition: transform .2s ease, visibility .2s; border-radius: 0 16px 16px 0; visibility: hidden;
      overflow-y: auto;
    }
    .drawer-head { display: flex; }
    body.nav-open .drawer {
      transform: none; visibility: visible; transition: transform .2s ease; box-shadow: 0 8px 24px rgba(10,37,64,.24);
    }
    body.nav-open .scrim { display: block; position: fixed; inset: 0; background: rgba(10,37,64,.4); z-index: 30; }
  }
  @media (min-width: 1024px) {
    .drawer { position: sticky; top: 68px; height: calc(100vh - 68px); }
  }

  /* ---------- Page header + toolbar ---------- */
  .back { display: inline-flex; align-items: center; gap: 4px; margin: -8px 0 8px -12px; }
  .page-header { display: flex; align-items: flex-start; gap: 16px; margin-bottom: 16px; }
  .page-header > div { flex: 1; min-width: 0; }
  .page-title { font-size: 24px; line-height: 32px; font-weight: 700; color: var(--secondary); }
  .page-caption { color: var(--on-surface-variant); margin-top: 4px; }
  .toolbar {
    display: flex; align-items: center; gap: 12px; background: var(--surface-low); border-radius: 12px;
    padding: 12px; margin-bottom: 16px;
  }
  .search {
    height: 40px; width: 320px; max-width: 100%; border: 1px solid var(--outline); border-radius: 20px;
    background: var(--surface-lowest); display: flex; align-items: center; gap: 8px; padding: 0 16px; color: var(--on-surface-variant);
  }
  .search input { border: 0; outline: 0; font: inherit; flex: 1; min-width: 0; background: none; color: var(--on-surface); }
  .toolbar .grow { flex: 1; }
  .header-cta { display: inline-flex; }
  .toolbar-cta { display: none; }
  @media (max-width: 1023px) { .search { flex: 1; width: auto; } .toolbar .grow { display: none; } }
  @media (max-width: 599px) {
    .header-cta { display: none; }
    .toolbar { flex-direction: column; align-items: stretch; }
    .toolbar-cta { display: inline-flex; }
    .toolbar .btn { width: 100%; }
    .toolbar .chip { align-self: flex-start; }
  }

  /* ---------- Chips ---------- */
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
  .chip {
    height: 32px; padding: 0 12px; border-radius: 8px; display: inline-flex; align-items: center; gap: 6px;
    font-weight: 600; font-size: 13px; background: var(--surface-container); color: var(--on-surface); white-space: nowrap;
  }
  .chip.tertiary { background: var(--tertiary-container); color: var(--on-tertiary-container); }
  .chip.primary { background: var(--primary-container); color: var(--on-primary-container); }
  .chip.gold { background: var(--gold-container); color: var(--on-gold-container); }
  .chip.small { height: 24px; font-size: 12px; padding: 0 8px; }

  /* ---------- Data table → lista compact ---------- */
  .card { background: var(--surface-lowest); border: 1px solid var(--outline); border-radius: 12px; overflow: hidden; }
  table { width: 100%; border-collapse: collapse; }
  th {
    height: 48px; text-align: left; padding: 0 16px; background: var(--surface-container);
    font-size: 12px; font-weight: 600; color: var(--on-surface-variant); text-transform: uppercase; letter-spacing: .03em;
  }
  td { height: 52px; padding: 0 16px; border-top: 1px solid var(--outline-variant); }
  tbody tr:nth-child(even) td { background: #FAFCFE; }
  tbody tr.selected td { background: var(--primary-container); }
  tbody tr { cursor: pointer; }
  tbody tr:hover td { background: var(--surface-low); }
  td.actions, th.actions { text-align: right; white-space: nowrap; width: 1%; }
  td.actions .btn { height: 40px; }
  .num { font-variant-numeric: tabular-nums; }
  @media (max-width: 1279px) { .col-low { display: none; } }
  .list { display: none; list-style: none; margin: 0; padding: 0; }
  .list li {
    min-height: 72px; display: flex; align-items: center; gap: 12px; padding: 8px 4px 8px 16px;
    border-top: 1px solid var(--outline-variant); cursor: pointer;
  }
  .list li:first-child { border-top: 0; }
  .list .li-body { flex: 1; min-width: 0; }
  .list .li-title { font-size: 16px; line-height: 24px; font-weight: 600; }
  .list .li-sub { color: var(--on-surface-variant); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  @media (max-width: 599px) {
    .card table:not(.occ) { display: none; }
    .list { display: block; }
  }

  /* ---------- Master-detail ---------- */
  .md { display: grid; gap: var(--gutter); grid-template-columns: 1fr; align-items: start; }
  @media (min-width: 1280px) { .md { grid-template-columns: minmax(0, 5fr) minmax(0, 6fr); } }
  .panel { background: var(--surface-lowest); border: 1px solid var(--outline); border-radius: 12px; }
  .panel-head {
    display: flex; align-items: center; gap: 8px; padding: 16px; border-bottom: 1px solid var(--outline-variant);
  }
  .panel-head h2 { font-size: 16px; line-height: 24px; font-weight: 600; flex: 1; }
  .panel.secondary { border-left: 4px solid var(--tertiary); }
  .panel.secondary .panel-head { background: var(--primary-container); border-radius: 8px 12px 0 0; }
  .fields { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px 24px; padding: 16px; }
  .field-label { font-size: 12px; font-weight: 600; color: var(--on-surface-variant); }
  .field-value { font-size: 16px; line-height: 24px; }
  @media (max-width: 599px) { .fields { grid-template-columns: 1fr; } }
  .panel-actions { display: flex; flex-wrap: wrap; gap: 8px; padding: 0 16px 16px; }
  .panel-foot { padding: 12px 16px 16px; }
  @media (max-width: 599px) { .panel-foot .btn { width: 100%; } }

  /* ---------- Tabs ---------- */
  .tabs {
    display: flex; border-bottom: 1px solid var(--outline); margin: 16px 0; overflow-x: auto; scrollbar-width: none;
  }
  .tabs::-webkit-scrollbar { display: none; }
  .tab {
    height: 48px; padding: 0 20px; border: 0; background: none; font-weight: 600; color: var(--on-surface-variant);
    cursor: pointer; white-space: nowrap; position: relative; text-decoration: none; display: inline-flex; align-items: center;
  }
  .tab[aria-selected="true"] { color: var(--primary); }
  .tab[aria-selected="true"]::after {
    content: ''; position: absolute; left: 12px; right: 12px; bottom: 0; height: 3px; border-radius: 3px 3px 0 0; background: var(--primary);
  }

  /* ---------- Occupancy grid ---------- */
  .grid-wrap { overflow-x: auto; }
  .occ { border-collapse: separate; border-spacing: 4px; min-width: 640px; }
  .occ th, .occ td { height: 40px; border: 0; border-radius: 8px; text-align: center; padding: 0 8px; font-size: 13px; }
  .occ th { background: none; height: 32px; }
  .occ th.row-head {
    position: sticky; left: 0; background: var(--surface-lowest); text-align: left; z-index: 1;
    font-family: var(--mono); color: var(--on-surface); text-transform: none;
  }
  .occ td.free { background: var(--occ-free); color: #1B6B4A; }
  .occ td.taken { background: var(--occ-taken); color: var(--on-surface-variant); }
  .occ td.exc { background: var(--occ-exception); color: var(--on-tertiary-container); font-weight: 600; box-shadow: inset 0 0 0 1px var(--tertiary); }
  .legend { display: flex; flex-wrap: wrap; gap: 8px 16px; padding: 12px 16px; color: var(--on-surface-variant); font-size: 12px; }
  .legend i { display: inline-block; width: 12px; height: 12px; border-radius: 3px; vertical-align: -1px; margin-right: 6px; }

  /* ---------- Banners ---------- */
  .banner {
    display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-radius: 8px; border: 1px solid; margin-bottom: 16px;
  }
  .banner .dot { width: 8px; height: 8px; border-radius: 4px; flex: none; background: currentColor; }
  .banner p { flex: 1; color: var(--on-surface); }
  .banner strong { display: block; }
  .banner.error { background: var(--error-container); border-color: var(--error); color: var(--error); }
  .banner.identity { background: var(--primary-container); border-color: var(--primary); color: var(--primary); }
  @media (max-width: 599px) {
    .banner { flex-wrap: wrap; align-items: flex-start; }
    .banner .dot { margin-top: 6px; }
    .banner p { flex-basis: calc(100% - 20px); }
    .banner .btn { margin-left: 8px; }
  }

  .empty {
    text-align: center; padding: 48px 24px; position: relative; overflow: hidden;
  }
  .empty .geo { width: 96px; height: 96px; margin: 0 auto 16px; position: relative; }
  .empty .geo span { position: absolute; border-radius: 16px; }
  .empty .geo span:nth-child(1) { inset: 0 24px 24px 0; background: var(--primary-container); }
  .empty .geo span:nth-child(2) { inset: 32px 0 0 32px; background: var(--tertiary-container); border: 2px solid var(--tertiary); }
  .empty h2 { font-size: 16px; line-height: 24px; font-weight: 600; }
  .empty p { color: var(--on-surface-variant); margin: 4px auto 16px; max-width: 360px; }

  /* ---------- Dialog ---------- */
  .dialog-scrim { position: fixed; inset: 0; background: rgba(10,37,64,.4); z-index: 50; display: grid; place-items: center; padding: 24px; }
  .dialog {
    background: var(--surface-lowest); border-radius: 28px; width: 560px; max-width: 100%; max-height: 100%;
    display: flex; flex-direction: column; box-shadow: 0 8px 24px rgba(10,37,64,.24);
  }
  .dialog-head { display: flex; align-items: center; gap: 8px; padding: 24px 24px 16px; }
  .dialog-head h2 { font-size: 24px; line-height: 32px; font-weight: 700; flex: 1; }
  .dialog-head .icon-btn { display: none; }
  .dialog-body { padding: 0 24px; overflow-y: auto; display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .dialog-body .full { grid-column: 1 / -1; }
  .dialog-foot { display: flex; justify-content: flex-end; gap: 8px; padding: 24px; }
  .tf label { display: block; font-size: 12px; font-weight: 600; color: var(--on-surface-variant); margin-bottom: 4px; }
  .tf input, .tf select {
    width: 100%; height: 56px; border: 1px solid var(--outline); border-radius: 4px; padding: 0 16px; font: inherit; font-size: 16px;
    background: var(--surface-lowest); color: var(--on-surface);
  }
  @media (max-width: 1023px) { .dialog-body { grid-template-columns: 1fr; } }
  @media (max-width: 599px) {
    .dialog-scrim { padding: 0; }
    .dialog { width: 100%; height: 100%; border-radius: 0; }
    .dialog-head { padding: 8px 16px 8px 8px; border-bottom: 1px solid var(--outline-variant); }
    .dialog-head h2 { font-size: 20px; line-height: 28px; }
    .dialog-head .icon-btn { display: inline-flex; }
    .dialog-body { padding: 16px; flex: 1; align-content: start; }
    .dialog-foot { border-top: 1px solid var(--outline-variant); padding: 12px 16px; }
    .dialog-foot .btn { flex: 1; }
  }

  /* ---------- Login ---------- */
  .login { min-height: 100vh; display: grid; grid-template-columns: 1fr 1fr; }
  .login-brand {
    background: var(--primary); color: #fff; padding: 48px; position: relative; overflow: hidden;
    display: flex; flex-direction: column; justify-content: flex-end;
  }
  .login-brand .shape { position: absolute; border-radius: 32px; }
  .login-brand .s1 { width: 280px; height: 280px; right: -60px; top: -60px; background: rgba(255,255,255,.08); transform: rotate(20deg); }
  .login-brand .s2 { width: 160px; height: 160px; right: 120px; top: 140px; background: var(--tertiary); opacity: .9; transform: rotate(45deg); border-radius: 24px; }
  .login-brand .s3 { width: 96px; height: 96px; left: 48px; top: 64px; border: 3px solid rgba(255,255,255,.4); transform: rotate(12deg); border-radius: 20px; }
  .login-brand .name { font-size: 32px; line-height: 40px; font-weight: 700; position: relative; }
  .login-brand .cap { opacity: .85; margin-top: 4px; position: relative; font-size: 16px; }
  .login-brand .stripe { height: 4px; width: 64px; background: var(--tertiary); border-radius: 2px; margin-bottom: 16px; position: relative; }
  .login-main { display: grid; place-items: center; padding: 24px; background: var(--background); }
  .login-card {
    width: 100%; max-width: 440px; background: var(--surface-lowest); border-radius: 12px; padding: 32px;
    box-shadow: 0 4px 16px rgba(10,37,64,.12);
  }
  .login-card h1 { font-size: 24px; line-height: 32px; font-weight: 700; color: var(--secondary); }
  .login-card .sub { color: var(--on-surface-variant); margin: 4px 0 24px; }
  .login-card .tf { margin-bottom: 16px; }
  .login-card .btn { width: 100%; margin-top: 8px; }
  .login-foot { text-align: center; color: var(--on-surface-variant); font-size: 12px; margin-top: 16px; }
  @media (max-width: 1023px) {
    .login { grid-template-columns: 1fr; grid-template-rows: auto 1fr; }
    .login-brand { padding: 32px var(--page); min-height: 180px; }
    .login-brand .s2 { right: 40px; top: 24px; width: 112px; height: 112px; }
    .login-brand .s3 { display: none; }
    .login-main { align-items: start; padding-top: 32px; }
  }
  @media (max-width: 599px) {
    .login-brand { min-height: 128px; padding: 24px 16px; }
    .login-brand .name { font-size: 24px; line-height: 32px; }
    .login-brand .cap { font-size: 14px; }
    .login-brand .s1 { width: 160px; height: 160px; right: -40px; top: -60px; }
    .login-brand .s2 { width: 64px; height: 64px; right: 32px; top: 24px; }
    .login-main { padding: 0; background: var(--surface-lowest); }
    .login-card { max-width: none; border-radius: 0; box-shadow: none; padding: 24px 16px; }
  }

  .menu {
    position: absolute; right: 8px; margin-top: 4px; background: var(--surface-lowest); border-radius: 8px;
    box-shadow: 0 4px 16px rgba(10,37,64,.2); padding: 8px 0; z-index: 10; min-width: 160px;
  }
  .menu button { display: flex; gap: 12px; align-items: center; width: 100%; height: 48px; padding: 0 16px; border: 0; background: none; cursor: pointer; }
  .menu button.danger { color: var(--error); }
  .rel { position: relative; }
</style>
</head>
<body>
<div id="app"></div>
<script>
const NAV = [
  ['funcionarios', 'Funcionários', 'badge'],
  ['professores', 'Professores', 'school'],
  ['alunos', 'Alunos', 'person'],
  ['salas', 'Salas de Aula', 'meeting_room'],
  ['recursos', 'Recursos', 'inventory_2'],
  ['disciplinas', 'Disciplinas', 'menu_book'],
  ['turmas', 'Turmas', 'groups'],
];

const SALAS = [
  { id: 'b201', codigo: 'B201', predio: 'Prédio 32', cap: 40, andar: '2º', turmas: 3, acess: 3 },
  { id: 'a105', codigo: 'A105', predio: 'Prédio 30', cap: 30, andar: '1º', turmas: 2, acess: 1 },
  { id: 'lab', codigo: 'Lab Soft', predio: 'Prédio 32', cap: 24, andar: '3º', turmas: 1, acess: 2 },
  { id: 'c310', codigo: 'C310', predio: 'Prédio 15', cap: 60, andar: '3º', turmas: 4, acess: 0 },
  { id: 'aud', codigo: 'Auditório 15', predio: 'Prédio 15', cap: 120, andar: 'Térreo', turmas: 2, acess: 4 },
];

const AULAS = [

const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const icon = n => `<span class="ms" aria-hidden="true">${n}</span>`;

function parseRoute() {
  const raw = location.hash.replace(/^#/, '') || '/salas';
  const [path, qs] = raw.split('?');
  return { parts: path.split('/').filter(Boolean), q: new URLSearchParams(qs || '') };
}

function drawer(active) {

function shell(active, content) {

    <div class="toolbar">

      if (f === 'JK' && d === 'Seg') return '<td class="taken">SE-A</td>';

function loginPage(q) {
  const erro = q.get('erro');
  const banner = erro === '401'
    ? `<div class="banner error" role="alert"><span class="dot"></span><p>Não foi possível entrar. Verifique usuário e senha.</p></div>`
    : erro === '503'
    ? `<div class="banner identity" role="alert"><span class="dot"></span><p>Identidade indisponível. Tente novamente em instantes.</p></div>`
    : '';
  return `
  <div class="login">
    <div class="login-brand">
      <span class="shape s1"></span><span class="shape s2"></span><span class="shape s3"></span>
      <div class="stripe"></div>
      <div class="name">Closed CRAS</div>
      <div class="cap">PUCRS · Construção de Software</div>
    </div>
    <div class="login-main">
      <form class="login-card" onsubmit="location.hash='#/home';return false">
        <h1 tabindex="-1">Entrar</h1>
        <p class="sub">Use sua conta institucional.</p>
        ${banner}
        <div class="tf"><label for="u">Usuário</label><input id="u" autocomplete="username" value="marina.silva"></div>
        <div class="tf"><label for="p">Senha</label><input id="p" type="password" autocomplete="current-password" value="••••••••"></div>
        <button class="btn btn-filled" type="submit">Entrar</button>
        <p class="login-foot">Problemas para acessar? Procure a secretaria do curso.</p>
      </form>
    </div>
  </div>`;
}

function render() {
  const { parts, q } = parseRoute();
  const app = document.getElementById('app');
  const [section, id] = parts;
  document.body.classList.remove('nav-open');
  if (section === 'login') {
    app.innerHTML = loginPage(q);
  } else {
    let content;
    if (section === 'salas' && id) content = salaDetalhe();
    else if (section === 'salas') content = salasPage(q);
    else if (section === 'turmas') content = turmaPage(q);
    else if (section === 'alunos' && q.get('erro') === '503') content = alunosErro();
    else if (section === 'home') content = homePage();
    else content = placeholder((NAV.find(n => n[0] === section) || [, 'Closed CRAS'])[1]);
    app.innerHTML = shell(section, content);
    if (q.get('nav') === 'open') openNav();
  }
  wire();
  const h1 = app.querySelector('h1');
  if (h1) h1.focus({ preventScroll: true });
}

function openNav() {
  document.body.classList.add('nav-open');
  const first = document.querySelector('#drawer .nav-item');
  if (first && matchMedia('(max-width: 1023px)').matches) first.focus();
}
function closeNav() {
  if (!document.body.classList.contains('nav-open')) return;
  document.body.classList.remove('nav-open');
  document.getElementById('menu-btn')?.focus();
}

function wire() {
  document.getElementById('menu-btn')?.addEventListener('click', () => {
    if (matchMedia('(max-width: 1023px)').matches) openNav();
  });
  document.getElementById('home-menu')?.addEventListener('click', openNav);
  document.getElementById('close-nav')?.addEventListener('click', closeNav);
  document.getElementById('scrim')?.addEventListener('click', closeNav);
  document.querySelectorAll('[data-href]').forEach(el => el.addEventListener('click', e => {
    if (e.target.closest('button, a')) return;
    location.hash = el.dataset.href;
  }));
  document.querySelectorAll('[data-dialog]').forEach(el => el.addEventListener('click', () => {
    location.hash = '#/salas?dialog=' + el.dataset.dialog;
  }));
  document.querySelectorAll('.list .icon-btn[aria-label^="Mais ações"]').forEach(btn => btn.addEventListener('click', e => {
    e.stopPropagation();
    document.querySelectorAll('.menu').forEach(m => m.remove());
    const li = btn.closest('li');
    li.classList.add('rel');
    li.insertAdjacentHTML('beforeend',
      `<div class="menu" role="menu"><button role="menuitem">${icon('edit')}Editar</button><button role="menuitem" class="danger">${icon('delete')}Excluir</button></div>`);
    li.querySelector('.menu button').focus();
  }));
}

document.addEventListener('keydown', e => {
  if (e.key !== 'Escape') return;
  if (document.querySelector('.menu')) { document.querySelectorAll('.menu').forEach(m => m.remove()); return; }
  if (document.querySelector('.dialog-scrim')) { location.hash = '#/salas'; return; }
  closeNav();
});
document.addEventListener('click', e => {
  if (!e.target.closest('.menu, .icon-btn')) document.querySelectorAll('.menu').forEach(m => m.remove());
});
window.addEventListener('hashchange', render);
render();
</script>
