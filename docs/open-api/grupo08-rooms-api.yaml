    Error:
      title: Error
      description: Envelope de erro do sistema (mesmo formato da API oauth do T1). error_code = RM-<status HTTP> nos 
        erros da API rooms; error_stack traz os erros anteriores, do mais antigo ao mais recente.
      type: object
      required:
        - error_code
        - error_description
        - error_source
        - error_stack
      properties:
        error_code:
          type: string
          pattern: ^[A-Z]{2}-[0-9]{3}$
          description: 'Código do erro final: sigla da API de origem + status HTTP (ex.: RM-404).'
        error_description:
          type: string
          description: Descrição do erro, escrita pelo grupo.
        error_source:
          type: string
          description: 'API de origem do erro final (ex.: RoomsAPI).'
        error_stack:
          type: array
          items:
            type: object
            required:
              - error_code
              - error_description
              - error_source
            properties:
              error_code:
                type: string
                pattern: ^[A-Z]{2}-[0-9]{3}$
              error_description:
                type: string
              error_source:
                type: string
            additionalProperties: false
          description: Pilha dos erros até o erro final (vazia quando o erro nasceu na própria API rooms).
      additionalProperties: false
      examples:
        - error_code: RM-404
          error_description: Sala 6f1c2b9e-8d4a-4c3e-9b1a-2f5d7e8c9a01 não encontrada.
          error_source: RoomsAPI
          error_stack: []
    TextFilter:
      type: string
      description: 'Valor do filtro, opcionalmente precedido de um operador: `{neq}`, `{gt}`, `{gteq}`, `{lt}`, `{lteq}` ou
        `{like}` (use `%` como curinga; não diferencia maiúsculas de minúsculas).'
      pattern: '^(\{(neq|gt|gteq|lt|lteq|like)\}.+|(?!\{[a-z]+\}).+)$'
    IntegerFilter:
      type: string
      description: 'Número inteiro, opcionalmente precedido de um operador: `{neq}`, `{gt}`, `{gteq}`, `{lt}` ou `{lteq}`.'
      pattern: '^(\{(neq|gt|gteq|lt|lteq)\})?[0-9]+$'
    BooleanFilter:
      type: string
      description: '`true` ou `false`, opcionalmente precedido de `{neq}`.'
      pattern: '^(\{neq\})?(true|false)$'
  responses:
    BadRequest:
      description: Request com erro, por exemplo um id que não é um UUID válido
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error_code: RM-400
            error_description: O id informado não é um UUID válido.
            error_source: RoomsAPI
            error_stack: []
    BadRequestBody:
      description: Request, incluindo o JSON, com erro (JSON malformado, campo obrigatório ausente, campo desconhecido, 
        tipo ou valor inválido, ou, com a validação de recursos ligada, id de resourceIds que não existe na API 
        resources)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error_code: RM-400
            error_description: O campo name é obrigatório.
            error_source: RoomsAPI
            error_stack: []
    BadRequestQuery:
      description: Request com erro (id inválido, ou query string com atributo desconhecido, operador inválido, valor 
        incompatível com o tipo do atributo, ou sort, page ou size inválidos)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error_code: RM-400
            error_description: O operador {like} não pode ser usado no atributo capacity.
            error_source: RoomsAPI
            error_stack: []
    Unauthorized:
      description: Não enviou Authorization ou o access token é inválido ou expirou
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error_code: RM-401
            error_description: Access token ausente, inválido ou expirado.
            error_source: RoomsAPI
            error_stack: []
    Forbidden:
      description: Usuário autenticado não tem acesso a essa função
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error_code: RM-403
            error_description: O usuário autenticado não tem o papel administrator, exigido para esta operação.
            error_source: RoomsAPI
            error_stack: []
    RoomNotFound:
      description: Sala {id} não encontrada
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error_code: RM-404
            error_description: Sala 6f1c2b9e-8d4a-4c3e-9b1a-2f5d7e8c9a01 não encontrada.
            error_source: RoomsAPI
            error_stack: []
    NoRoomMatches:
      description: Nenhuma sala atende à query string informada
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error_code: RM-404
            error_description: Nenhuma sala atende aos filtros informados.
            error_source: RoomsAPI
            error_stack: []
    RoomNotFoundOrNoFeatureMatches:
      description: Sala {id} não encontrada, ou nenhuma característica atende à query string informada
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error_code: RM-404
            error_description: Nenhuma característica de acessibilidade atende aos filtros informados.
            error_source: RoomsAPI
            error_stack: []
    FeatureNotFound:
      description: Sala {id} ou característica {featureId} não encontrada
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error_code: RM-404
            error_description: Característica de acessibilidade 9a8b7c6d-5e4f-4a3b-8c2d-1e0f9a8b7c6d não encontrada na 
              sala 6f1c2b9e-8d4a-4c3e-9b1a-2f5d7e8c9a01.
            error_source: RoomsAPI
            error_stack: []
    ResourcesUnavailable:
      description: A validação de recursos está ligada e a API resources não respondeu
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error_code: RM-503
            error_description: A API resources não respondeu; não foi possível validar resourceIds.
            error_source: RoomsAPI
            error_stack:
              - error_code: RS-503
                error_description: Serviço indisponível.
                error_source: ResourcesAPI
    RoomConflict:
      description: Conflito - o code já é usado por outra sala, ou um recurso de resourceIds já está instalado em outra 
        sala
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error_code: RM-409
            error_description: Já existe uma sala com o código 32/405.
            error_source: RoomsAPI
            error_stack: []
