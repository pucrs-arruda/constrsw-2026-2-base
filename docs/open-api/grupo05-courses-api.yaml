openapi: 3.1.0
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
info:
  title: Courses API — Disciplinas e Referências Bibliográficas
  version: 1.0.0
  description: |
    Contrato proposto do Grupo 05 para a segunda entrega do T2 de Construção de Software. Banco previsto: PostgreSQL. Toda disciplina possui 1..* referências e um professor responsável externo. A existência do professor, a unicidade do código, a propriedade das referências e o mínimo de referências devem ser garantidos pelo backend; JSON Schema valida apenas a estrutura. A API ainda não foi implementada nesta entrega. Use Accept: application/json e, nas escritas, Content-Type: application/json. O token Bearer é obtido no serviço de autenticação do projeto.

    ## Exclusão lógica

    Todas as exclusões são lógicas e controladas pelo atributo `enabled` das classes. Um `DELETE` não remove o registro do banco: apenas define `enabled=false`. O atributo é somente leitura (`readOnly`): nasce `true` e não pode ser enviado pelo cliente.

    Registros com `enabled=false` não aparecem nas listagens, a consulta por id responde `404` e não podem ser alterados nem excluídos novamente (`404`).
servers:
- url: '{baseUrl}/api/v1'
  description: Origem configurável; localhost:8000 é somente um exemplo até o backend definir sua porta.
  variables:
    baseUrl:
      default: http://localhost:8000
      description: Origem da API courses, sem /api/v1 no final.
tags:
- name: Courses
  description: Recurso principal.
- name: Bibliographic references
  description: Coleção secundária pertencente a uma disciplina.
security:
- bearerAuth: []
paths:
  /courses:
    post:
      tags:
      - Courses
      operationId: createCourse
      summary: Criar disciplina com referências
      description: Valida o professor pela API externa; rejeita código duplicado com 409. A criação de disciplina e 
        referências é atômica. A coleção deve conter ao menos um item.
      responses:
        '201':
          description: Disciplina e referências criadas na mesma transação.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Course'
              examples:
                example:
                  value:
                    id: 42cedfbd-f998-4be7-a278-b74322fdf21a
                    enabled: true
                    code: 46504-04
                    name: Construção de Software
                    syllabus: Modelagem, construção e integração de APIs REST.
                    workloadHours: 60
                    professorId: prof-eduardo
                    bibliographicReferences:
                    - id: 079edc66-7c2d-49da-bd20-523ec4b99cf4
                      enabled: true
                      courseId: 42cedfbd-f998-4be7-a278-b74322fdf21a
                      title: Engenharia de Software
                      authors: Ian Sommerville
                      publisher: Pearson
                      year: 2019
                      edition: '10'
                      type: BASIC
          headers:
            Location:
              description: URI do recurso criado.
              schema:
                type: string
                format: uri-reference
              example: /api/v1/courses/42cedfbd-f998-4be7-a278-b74322fdf21a
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '409':
          $ref: '#/components/responses/Error409'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CourseCreate'
            examples:
              example:
                value:
                  code: 46504-04
                  name: Construção de Software
                  syllabus: Modelagem, construção e integração de APIs REST.
                  workloadHours: 60
                  professorId: prof-eduardo
                  bibliographicReferences:
                  - title: Engenharia de Software
                    authors: Ian Sommerville
                    publisher: Pearson
                    year: 2019
                    edition: '10'
                    type: BASIC
    get:
      tags:
      - Courses
      operationId: listCourses
      summary: Listar ou filtrar disciplinas
      description: Combina filtros com AND; sem operador explícito aplica igualdade. Sem filtros, uma coleção vazia 
        retorna 200 com []. Com filtros sem correspondência, retorna 404, seguindo o exemplo do Moodle. Filtros 
        desconhecidos ou operadores inválidos retornam 400. Não há paginação nesta entrega.
      responses:
        '200':
          description: Lista de disciplinas com suas referências.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CourseList'
              examples:
                example:
                  value:
                  - id: 42cedfbd-f998-4be7-a278-b74322fdf21a
                    enabled: true
                    code: 46504-04
                    name: Construção de Software
                    syllabus: Modelagem, construção e integração de APIs REST.
                    workloadHours: 60
                    professorId: prof-eduardo
                    bibliographicReferences:
                    - id: 079edc66-7c2d-49da-bd20-523ec4b99cf4
                      enabled: true
                      courseId: 42cedfbd-f998-4be7-a278-b74322fdf21a
                      title: Engenharia de Software
                      authors: Ian Sommerville
                      publisher: Pearson
                      year: 2019
                      edition: '10'
                      type: BASIC
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
      parameters:
      - $ref: '#/components/parameters/CodeFilter'
      - $ref: '#/components/parameters/NameFilter'
      - $ref: '#/components/parameters/WorkloadHoursFilter'
      - $ref: '#/components/parameters/ProfessorIdFilter'
  /courses/{courseId}:
    parameters:
    - $ref: '#/components/parameters/CourseId'
    get:
      tags:
      - Courses
      operationId: getCourse
      summary: Consultar disciplina por ID
      description: ''
      responses:
        '200':
          description: Disciplina completa.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Course'
              examples:
                example:
                  value:
                    id: 42cedfbd-f998-4be7-a278-b74322fdf21a
                    enabled: true
                    code: 46504-04
                    name: Construção de Software
                    syllabus: Modelagem, construção e integração de APIs REST.
                    workloadHours: 60
                    professorId: prof-eduardo
                    bibliographicReferences:
                    - id: 079edc66-7c2d-49da-bd20-523ec4b99cf4
                      enabled: true
                      courseId: 42cedfbd-f998-4be7-a278-b74322fdf21a
                      title: Engenharia de Software
                      authors: Ian Sommerville
                      publisher: Pearson
                      year: 2019
                      edition: '10'
                      type: BASIC
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
    put:
      tags:
      - Courses
      operationId: replaceCourse
      summary: Substituir campos escalares da disciplina
      description: Substitui os campos escalares; `syllabus` omitida é removida. Preserva IDs e a coleção de 
        referências, gerenciada exclusivamente nas rotas secundárias. Valida professorId pela API externa; código 
        duplicado retorna 409.
      responses:
        '200':
          description: Disciplina completa após substituição.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Course'
              examples:
                example:
                  value:
                    id: 42cedfbd-f998-4be7-a278-b74322fdf21a
                    enabled: true
                    code: 46504-04
                    name: Construção de Software
                    syllabus: Modelagem, construção e integração de APIs REST.
                    workloadHours: 60
                    professorId: prof-eduardo
                    bibliographicReferences:
                    - id: 079edc66-7c2d-49da-bd20-523ec4b99cf4
                      enabled: true
                      courseId: 42cedfbd-f998-4be7-a278-b74322fdf21a
                      title: Engenharia de Software
                      authors: Ian Sommerville
                      publisher: Pearson
                      year: 2019
                      edition: '10'
                      type: BASIC
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CourseUpdate'
            examples:
              example:
                value:
                  code: 46504-04
                  name: Construção de Software
                  syllabus: Modelagem, construção e integração de APIs REST.
                  workloadHours: 60
                  professorId: prof-eduardo
    patch:
      tags:
      - Courses
      operationId: patchCourse
      summary: Alterar parcialmente a disciplina
      description: Objeto JSON com ao menos um campo escalar editável. Campos omitidos permanecem inalterados. Não é 
        JSON Patch nem JSON Merge Patch; null e alterações diretas na coleção não são aceitos. Valida professorId quando
        informado.
      responses:
        '200':
          description: Disciplina completa após alteração.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Course'
              examples:
                example:
                  value:
                    id: 42cedfbd-f998-4be7-a278-b74322fdf21a
                    enabled: true
                    code: 46504-04
                    name: Construção de Software
                    syllabus: Modelagem, construção e integração de APIs REST.
                    workloadHours: 80
                    professorId: prof-eduardo
                    bibliographicReferences:
                    - id: 079edc66-7c2d-49da-bd20-523ec4b99cf4
                      enabled: true
                      courseId: 42cedfbd-f998-4be7-a278-b74322fdf21a
                      title: Engenharia de Software
                      authors: Ian Sommerville
                      publisher: Pearson
                      year: 2019
                      edition: '10'
                      type: BASIC
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CoursePatch'
            examples:
              example:
                value:
                  workloadHours: 80
    delete:
      tags:
      - Courses
      operationId: deleteCourse
      summary: Excluir disciplina e suas referências (exclusão lógica)
      description: 'Exclusão lógica: define `enabled=false` na disciplina e em todas as suas referências, na mesma transação;
        nada é removido do banco. A obrigação de ter referências não impede excluir a própria disciplina.'
      responses:
        '204':
          description: Disciplina e suas referências excluídas logicamente (`enabled=false`); sem corpo.
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
  /courses/{courseId}/bibliographic-references:
    parameters:
    - $ref: '#/components/parameters/CourseId'
    post:
      tags:
      - Bibliographic references
      operationId: createReference
      summary: Adicionar referência à disciplina
      description: O servidor atribui o ID e o vínculo à disciplina do path. A mesma obra pode aparecer em outras 
        disciplinas como outro registro; não há unicidade global por título ou ISBN.
      responses:
        '201':
          description: Referência criada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BibliographicReference'
              examples:
                example:
                  value:
                    id: 079edc66-7c2d-49da-bd20-523ec4b99cf4
                    enabled: true
                    courseId: 42cedfbd-f998-4be7-a278-b74322fdf21a
                    title: Engenharia de Software
                    authors: Ian Sommerville
                    publisher: Pearson
                    year: 2019
                    edition: '10'
                    type: BASIC
          headers:
            Location:
              description: URI do recurso criado.
              schema:
                type: string
                format: uri-reference
              example: 
                /api/v1/courses/42cedfbd-f998-4be7-a278-b74322fdf21a/bibliographic-references/079edc66-7c2d-49da-bd20-523ec4b99cf4
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BibliographicReferenceCreate'
            examples:
              example:
                value:
                  title: Engenharia de Software
                  authors: Ian Sommerville
                  publisher: Pearson
                  year: 2019
                  edition: '10'
                  type: BASIC
    get:
      tags:
      - Bibliographic references
      operationId: listReferences
      summary: Listar ou filtrar referências da disciplina
      description: Checa a existência da disciplina antes da busca. Combina filtros com AND e limita o resultado às 
        referências dessa disciplina. Com filtros sem correspondência, retorna 404. Sem paginação; atributos ou 
        operadores desconhecidos geram 400.
      responses:
        '200':
          description: Referências da disciplina que atendem aos filtros.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BibliographicReferenceList'
              examples:
                example:
                  value:
                  - id: 079edc66-7c2d-49da-bd20-523ec4b99cf4
                    enabled: true
                    courseId: 42cedfbd-f998-4be7-a278-b74322fdf21a
                    title: Engenharia de Software
                    authors: Ian Sommerville
                    publisher: Pearson
                    year: 2019
                    edition: '10'
                    type: BASIC
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
      parameters:
      - $ref: '#/components/parameters/TitleFilter'
      - $ref: '#/components/parameters/AuthorsFilter'
      - $ref: '#/components/parameters/YearFilter'
      - $ref: '#/components/parameters/TypeFilter'
  /courses/{courseId}/bibliographic-references/{referenceId}:
    parameters:
    - $ref: '#/components/parameters/CourseId'
    - $ref: '#/components/parameters/ReferenceId'
    get:
      tags:
      - Bibliographic references
      operationId: getReference
      summary: Consultar referência da disciplina
      description: Retorna 404 se a disciplina não existir, se a referência não existir ou se pertencer a outra 
        disciplina.
      responses:
        '200':
          description: Referência completa.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BibliographicReference'
              examples:
                example:
                  value:
                    id: 079edc66-7c2d-49da-bd20-523ec4b99cf4
                    enabled: true
                    courseId: 42cedfbd-f998-4be7-a278-b74322fdf21a
                    title: Engenharia de Software
                    authors: Ian Sommerville
                    publisher: Pearson
                    year: 2019
                    edition: '10'
                    type: BASIC
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
    put:
      tags:
      - Bibliographic references
      operationId: replaceReference
      summary: Substituir referência da disciplina
      description: Checa o vínculo com a disciplina do path. Substitui os dados editáveis e remove opcionais omitidos. 
        Preserva id e courseId; referências de outra disciplina retornam 404.
      responses:
        '200':
          description: Referência completa após substituição.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BibliographicReference'
              examples:
                example:
                  value:
                    id: 079edc66-7c2d-49da-bd20-523ec4b99cf4
                    enabled: true
                    courseId: 42cedfbd-f998-4be7-a278-b74322fdf21a
                    title: Engenharia de Software
                    authors: Ian Sommerville
                    publisher: Pearson
                    year: 2019
                    edition: '10'
                    type: BASIC
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BibliographicReferenceUpdate'
            examples:
              example:
                value:
                  title: Engenharia de Software
                  authors: Ian Sommerville
                  publisher: Pearson
                  year: 2019
                  edition: '10'
                  type: BASIC
    patch:
      tags:
      - Bibliographic references
      operationId: patchReference
      summary: Alterar parcialmente a referência
      description: Checa o vínculo com a disciplina do path. Objeto JSON com ao menos um atributo editável; omissões 
        preservam valores. null e alterações de id ou courseId não são aceitos. Referências de outra disciplina retornam
        404.
      responses:
        '200':
          description: Referência completa após alteração.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BibliographicReference'
              examples:
                example:
                  value:
                    id: 079edc66-7c2d-49da-bd20-523ec4b99cf4
                    enabled: true
                    courseId: 42cedfbd-f998-4be7-a278-b74322fdf21a
                    title: Engenharia de Software
                    authors: Ian Sommerville
                    publisher: Pearson
                    year: 2019
                    edition: '10'
                    type: SUPPLEMENTARY
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BibliographicReferencePatch'
            examples:
              example:
                value:
                  type: SUPPLEMENTARY
    delete:
      tags:
      - Bibliographic references
      operationId: deleteReference
      summary: Excluir referência da disciplina (exclusão lógica)
      description: 'Checa a propriedade da referência e, em transação com controle de concorrência, impede excluir a última
        referência ativa (`enabled=true`) de uma disciplina existente (409). Exclusão lógica: define `enabled=false`; nada
        é removido do banco. Referências de outra disciplina retornam 404.'
      responses:
        '204':
          description: Referência excluída logicamente (`enabled=false`); sem corpo.
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Token válido emitido pelo Keycloak/serviço OAuth do projeto.
  schemas:
    BibliographicReferenceCreate:
      type: object
      additionalProperties: false
      properties:
        title:
          type: string
          minLength: 1
          pattern: \S
          maxLength: 300
        authors:
          type: string
          minLength: 1
          pattern: \S
          description: Autores em texto; pode conter vários nomes.
        publisher:
          type: string
          minLength: 1
          pattern: \S
          maxLength: 150
        year:
          type: integer
          minimum: 1
          maximum: 9999
        edition:
          type: string
          minLength: 1
          pattern: \S
          maxLength: 50
        type:
          type: string
          enum:
          - BASIC
          - SUPPLEMENTARY
      required:
      - title
      - authors
      - type
      description: Nova referência da disciplina indicada no path; id e courseId são definidos pelo servidor.
      title: BibliographicReferenceCreate
    BibliographicReferenceUpdate:
      type: object
      additionalProperties: false
      properties:
        title:
          type: string
          minLength: 1
          pattern: \S
          maxLength: 300
        authors:
          type: string
          minLength: 1
          pattern: \S
          description: Autores em texto; pode conter vários nomes.
        publisher:
          type: string
          minLength: 1
          pattern: \S
          maxLength: 150
        year:
          type: integer
          minimum: 1
          maximum: 9999
        edition:
          type: string
          minLength: 1
          pattern: \S
          maxLength: 50
        type:
          type: string
          enum:
          - BASIC
          - SUPPLEMENTARY
      required:
      - title
      - authors
      - type
      description: Substitui os campos da referência. Campos opcionais omitidos são removidos; IDs permanecem imutáveis.
      title: BibliographicReferenceUpdate
    BibliographicReferencePatch:
      type: object
      additionalProperties: false
      properties:
        title:
          type: string
          minLength: 1
          pattern: \S
          maxLength: 300
        authors:
          type: string
          minLength: 1
          pattern: \S
          description: Autores em texto; pode conter vários nomes.
        publisher:
          type: string
          minLength: 1
          pattern: \S
          maxLength: 150
        year:
          type: integer
          minimum: 1
          maximum: 9999
        edition:
          type: string
          minLength: 1
          pattern: \S
          maxLength: 50
        type:
          type: string
          enum:
          - BASIC
          - SUPPLEMENTARY
      description: Altera somente os campos informados. Campos omitidos permanecem inalterados; null não é aceito.
      minProperties: 1
      title: BibliographicReferencePatch
    BibliographicReference:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        enabled:
          type: boolean
          readOnly: true
          default: true
          description: 'Exclusão lógica: true para registro ativo; false para registro excluído logicamente. Controlado pelo
            servidor.'
        courseId:
          type: string
          format: uuid
          readOnly: true
        title:
          type: string
          minLength: 1
          pattern: \S
          maxLength: 300
        authors:
          type: string
          minLength: 1
          pattern: \S
          description: Autores em texto; pode conter vários nomes.
        publisher:
          type: string
          minLength: 1
          pattern: \S
          maxLength: 150
        year:
          type: integer
          minimum: 1
          maximum: 9999
        edition:
          type: string
          minLength: 1
          pattern: \S
          maxLength: 50
        type:
          type: string
          enum:
          - BASIC
          - SUPPLEMENTARY
      required:
      - id
      - enabled
      - courseId
      - title
      - authors
      - type
      title: BibliographicReference
    CourseCreate:
      type: object
      additionalProperties: false
      properties:
        code:
          type: string
          minLength: 1
          pattern: \S
          maxLength: 20
          description: Código único da disciplina.
        name:
          type: string
          minLength: 1
          pattern: \S
          maxLength: 200
        syllabus:
          type: string
          minLength: 1
          pattern: \S
        workloadHours:
          type: integer
          minimum: 1
          maximum: 2147483647
        professorId:
          type: string
          minLength: 1
          pattern: \S
          maxLength: 100
          description: Identificador do professor responsável na API externa; alinhar o formato com o grupo de 
            professores.
        bibliographicReferences:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/BibliographicReferenceCreate'
      required:
      - code
      - name
      - workloadHours
      - professorId
      - bibliographicReferences
      description: Criação atômica da disciplina e de ao menos uma referência bibliográfica.
      title: CourseCreate
    CourseUpdate:
      type: object
      additionalProperties: false
      properties:
        code:
          type: string
          minLength: 1
          pattern: \S
          maxLength: 20
          description: Código único da disciplina.
        name:
          type: string
          minLength: 1
          pattern: \S
          maxLength: 200
        syllabus:
          type: string
          minLength: 1
          pattern: \S
        workloadHours:
          type: integer
          minimum: 1
          maximum: 2147483647
        professorId:
          type: string
          minLength: 1
          pattern: \S
          maxLength: 100
          description: Identificador do professor responsável na API externa; alinhar o formato com o grupo de 
            professores.
      required:
      - code
      - name
      - workloadHours
      - professorId
      description: Substitui todos os campos escalares editáveis da disciplina. Ementa omitida é removida. A coleção de 
        referências é preservada e tem rotas próprias.
      title: CourseUpdate
    CoursePatch:
      type: object
      additionalProperties: false
      properties:
        code:
          type: string
          minLength: 1
          pattern: \S
          maxLength: 20
          description: Código único da disciplina.
        name:
          type: string
          minLength: 1
          pattern: \S
          maxLength: 200
        syllabus:
          type: string
          minLength: 1
          pattern: \S
        workloadHours:
