  parameters:
    CourseId:
      name: courseId
      in: path
      required: true
      description: UUID da disciplina.
      schema:
        type: string
        format: uuid
      example: 42cedfbd-f998-4be7-a278-b74322fdf21a
    ReferenceId:
      name: referenceId
      in: path
      required: true
      description: UUID de uma referência pertencente à disciplina do path.
      schema:
        type: string
        format: uuid
      example: 079edc66-7c2d-49da-bd20-523ec4b99cf4
    CodeFilter:
      name: code
      in: query
      required: false
      description: Igualdade ou {neq}.
      schema:
        oneOf:
        - type: string
          minLength: 1
          pattern: ^(?!\{).*\S.*$
          maxLength: 20
        - type: string
          pattern: ^\{(?:neq)\}.*\S.*$
      examples:
        '1':
          value: 46504-04
        '2':
          value: '{neq}46504-04'
    NameFilter:
      name: name
      in: query
      required: false
      description: Igualdade, {neq} ou {like}. Em {like}, % representa qualquer sequência e _ um caractere; 
        percent-encode a URL.
      schema:
        oneOf:
        - type: string
          minLength: 1
          pattern: ^(?!\{).*\S.*$
          maxLength: 200
        - type: string
          pattern: ^\{(?:neq|like)\}.*\S.*$
      examples:
        '1':
          value: Construção de Software
        '2':
          value: '{like}%Software%'
    WorkloadHoursFilter:
      name: workloadHours
      in: query
      required: false
      description: Igualdade positiva ou comparações {neq}, {gt}, {gteq}, {lt}, {lteq}; operandos comparativos entre 0 e
        2147483647, sem sinal nem zeros à esquerda.
      schema:
        oneOf:
        - type: integer
          minimum: 1
          maximum: 2147483647
        - type: string
          pattern: 
            ^\{(?:neq|gt|gteq|lt|lteq)\}(?:0|[1-9][0-9]{0,8}|1[0-9]{9}|20[0-9]{8}|21[0-3][0-9]{7}|214[0-6][0-9]{6}|2147[0-3][0-9]{5}|21474[0-7][0-9]{4}|214748[0-2][0-9]{3}|2147483[0-5][0-9]{2}|21474836[0-3][0-9]|214748364[0-7])$
      examples:
        '1':
          value: 60
        '2':
          value: '{gteq}60'
        '3':
          value: '{lt}120'
    ProfessorIdFilter:
      name: professorId
      in: query
      required: false
      description: Igualdade ou {neq} sobre o ID externo.
      schema:
        oneOf:
        - type: string
          minLength: 1
          pattern: ^(?!\{).*\S.*$
          maxLength: 100
        - type: string
          pattern: ^\{(?:neq)\}.*\S.*$
      examples:
        '1':
          value: prof-eduardo
        '2':
          value: '{neq}prof-outro'
    TitleFilter:
      name: title
      in: query
      required: false
      description: Igualdade, {neq} ou {like}. Em {like}, % e _ funcionam como curingas.
      schema:
        oneOf:
        - type: string
          minLength: 1
          pattern: ^(?!\{).*\S.*$
          maxLength: 300
        - type: string
          pattern: ^\{(?:neq|like)\}.*\S.*$
      examples:
        '1':
          value: Engenharia de Software
        '2':
          value: '{like}%Software%'
    AuthorsFilter:
      name: authors
      in: query
      required: false
      description: Igualdade, {neq} ou {like} sobre o texto de `authors`.
      schema:
        oneOf:
        - type: string
          minLength: 1
          pattern: ^(?!\{).*\S.*$
        - type: string
          pattern: ^\{(?:neq|like)\}.*\S.*$
      examples:
        '1':
          value: Ian Sommerville
        '2':
          value: '{like}%Sommerville%'
    YearFilter:
      name: year
      in: query
      required: false
      description: Igualdade de 1 a 9999 ou comparações com operandos entre 0 e 9999, sem sinal nem zeros à esquerda. 
        Ausência de ano não corresponde a filtros sobre ano.
      schema:
        oneOf:
        - type: integer
          minimum: 1
          maximum: 9999
        - type: string
          pattern: ^\{(?:neq|gt|gteq|lt|lteq)\}(?:0|[1-9][0-9]{0,3})$
      examples:
        '1':
          value: 2019
        '2':
          value: '{gteq}2010'
    TypeFilter:
      name: type
      in: query
      required: false
      description: Igualdade ou {neq} para BASIC e SUPPLEMENTARY.
      schema:
        type: string
        enum:
        - BASIC
        - SUPPLEMENTARY
        - '{neq}BASIC'
        - '{neq}SUPPLEMENTARY'
      examples:
        '1':
          value: BASIC
        '2':
          value: '{neq}SUPPLEMENTARY'
  responses:
    Error400:
      description: 'Requisição inválida: JSON, UUID, filtros, atributos ou professorId inexistente. Propriedades desconhecidas
        também geram 400.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          examples:
            error:
              value:
                error_code: CO-400
                error_description: 'Requisição inválida: JSON, UUID, filtros, atributos ou professorId inexistente. Propriedades
                  desconhecidas também geram 400.'
                error_source: CoursesAPI
                error_stack: []
    Error401:
      description: Token Bearer ausente, inválido ou expirado.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          examples:
            error:
              value:
                error_code: CO-401
                error_description: Token Bearer ausente, inválido ou expirado.
                error_source: CoursesAPI
                error_stack: []
      headers:
        WWW-Authenticate:
          description: Desafio de autenticação Bearer.
          schema:
            type: string
          example: Bearer
    Error403:
      description: Usuário autenticado sem permissão para esta operação.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          examples:
            error:
              value:
                error_code: CO-403
                error_description: Usuário autenticado sem permissão para esta operação.
                error_source: CoursesAPI
                error_stack: []
    Error404:
      description: Disciplina ou referência não encontrada; referência não pertence à disciplina indicada; ou nenhum 
        resultado para os filtros informados.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          examples:
            error:
              value:
                error_code: CO-404
                error_description: Disciplina ou referência não encontrada; referência não pertence à disciplina 
                  indicada; ou nenhum resultado para os filtros informados.
                error_source: CoursesAPI
                error_stack: []
    Error409:
      description: 'Conflito com uma regra de domínio: código de disciplina duplicado ou tentativa de remover sua última referência.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          examples:
            error:
              value:
                error_code: CO-409
                error_description: 'Conflito com uma regra de domínio: código de disciplina duplicado ou tentativa de remover
                  sua última referência.'
                error_source: CoursesAPI
                error_stack: []
