    Problem:
      title: Problem
      description: RFC 9457. 409 com code = FR e type = urn:closed-cras:recusa:<code>; 422 com errors.
      type: object
      required:
      - type
      - title
      - status
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
        instance:
          type: string
          format: uri-reference
        code:
          type: string
          pattern: ^FR-[0-9]+$
        errors:
          type: array
          items:
            type: object
            required:
            - field
            - message
            properties:
              field:
                type: string
              message:
                type: string
            additionalProperties: false
    Identity:
      title: Identity
      description: Dados do JWT (Spine AD-4). IDs não aplicáveis vêm null.
      type: object
      required:
      - sub
      - email
      - roles
      - employeeId
      - professorId
      - studentId
      properties:
        sub:
          type: string
        email:
          type: string
          format: email
        roles:
          type: array
          items:
            type: string
        employeeId:
          type:
          - string
          - 'null'
        professorId:
          type:
          - string
          - 'null'
        studentId:
          type:
          - string
          - 'null'
      additionalProperties: false
