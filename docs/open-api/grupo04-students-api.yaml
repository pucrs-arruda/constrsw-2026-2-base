components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Student:
      title: Student
      description: Estudante (classe principal). Resposta de POST, GET, PUT e PATCH /students.
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
          examples:
          - 42cedfbd-f998-4be7-a278-b74322fdf21a
        enabled:
          type: boolean
          readOnly: true
          default: true
          description: 'Exclusão lógica: true para registro ativo; false para registro excluído logicamente. Controlado pelo
            servidor.'
        registration_number:
          type: string
          minLength: 1
          maxLength: 20
          description: Matrícula do estudante (única)
          examples:
          - '24100123'
        name:
          type: string
          minLength: 1
          maxLength: 150
          examples:
          - Caio Fernandes
        email:
          type: string
          format: email
          maxLength: 150
          examples:
          - caio.fernandes@edu.pucrs.br
        birth_date:
          type: string
          format: date
          description: Data no formato AAAA-MM-DD (deve estar no passado)
          examples:
          - '2004-03-15'
        phone:
          type:
          - string
          - 'null'
          pattern: ^\+?[0-9]{8,14}$
          maxLength: 15
          examples:
          - '+5551999998888'
        honors:
          type:
          - string
          - 'null'
          enum:
          - cum laude
          - magna cum laude
          - summa cum laude
          - 
          description: Láurea acadêmica do estudante; null quando não possui
          examples:
          - magna cum laude
      required:
