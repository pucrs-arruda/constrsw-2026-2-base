      description: 'Operadores (query string complexa): sem operador = igual; `{neq}` diferente; `{gt}` maior; `{gteq}` maior
        ou igual; `{lt}` menor; `{lteq}` menor ou igual; `{like}` contém (curingas `%` ou `*`, sem diferenciar maiúsculas).
        O mesmo atributo pode ser repetido (ex.: faixa de datas).


        Exemplo: `GET /api/v1/students/{id}/enrollments?status={neq}cancelled&start_date={gteq}2023-01-01`'
      parameters:
