# Contrato OpenAPI 3.1 da REST API students (Grupo 04). Também é o documento exibido no Swagger UI.
openapi: 3.1.0
info:
  title: Students API
  version: 1.0.0
  summary: REST API students — ConstrSW 2026/2 — Grupo 04
  description: |
    CRUD de estudantes (classe principal) e de seus vínculos acadêmicos (classe secundária, composição 1..0..*), persistidos em PostgreSQL.

    **Autenticação:** todas as rotas exigem `Authorization: Bearer <access_token>`. Obtenha o token em `POST http://localhost:8181/login` (API oauth) com `username=admin@pucrs.br` e `password=a12345678`, clique em **Authorize** e cole o `access_token`.

    **Autorização (realm roles do Keycloak):** GET = qualquer usuário autenticado; POST/PUT/PATCH/DELETE = `administrator` ou `coordinator` (os demais recebem 403).

    **Erros:** envelope `error_code` / `error_description` / `error_source` / `error_stack`.

    ## Exclusão lógica

    Todas as exclusões são lógicas e controladas pelo atributo `enabled` das classes. Um `DELETE` não remove o registro do banco: apenas define `enabled=false`. O atributo é somente leitura (`readOnly`): nasce `true` e não pode ser enviado pelo cliente.

    Registros com `enabled=false` não aparecem nas listagens, a consulta por id responde `404` e não podem ser alterados nem excluídos novamente (`404`).
servers:
- url: http://localhost:8103
  description: docker compose (local)
security:
- bearerAuth: []
tags:
- name: students
  description: Coleção principal
- name: enrollments
  description: 'Coleção secundária: vínculos acadêmicos do estudante'
paths:
  /api/v1/students:
    post:
      tags:
      - students
      operationId: createStudent
      summary: Cria um estudante
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StudentRequest'
            example:
              registration_number: '24100123'
              name: Caio Fernandes
              email: caio.fernandes@edu.pucrs.br
              birth_date: '2004-03-15'
              phone: '+5551999998888'
              honors:
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Student'
          headers:
            Location:
              description: URL do recurso criado
              schema:
                type: string
        '400':
          description: 'Bad Request: requisição, JSON ou filtro com erro'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: 'Unauthorized: Authorization ausente, token inválido ou expirado'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: 'Forbidden: o usuário autenticado não tem acesso a esta função'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: 'Conflict: já existe um estudante com a matrícula informada'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '415':
          description: 'Unsupported Media Type: use Content-Type application/json'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    get:
      tags:
      - students
      operationId: listStudents
      summary: Lista estudantes (todos, query string simples ou complexa)
      description: 'Sem parâmetros: todos os estudantes. Com parâmetros: filtro por `atributo=valor` (simples) ou `atributo={op}valor`
        (complexa), combinados com AND.


        Operadores (query string complexa): sem operador = igual; `{neq}` diferente; `{gt}` maior; `{gteq}` maior ou igual;
        `{lt}` menor; `{lteq}` menor ou igual; `{like}` contém (curingas `%` ou `*`, sem diferenciar maiúsculas). O mesmo
        atributo pode ser repetido (ex.: faixa de datas).


        Exemplo: `GET /api/v1/students?name={like}%silva%&birth_date={gteq}2000-01-01&honors={neq}cum laude`


        Nenhum resultado devolve `200` com lista vazia. Atributo, operador ou valor inválido devolve `400`.'
      parameters:
      - name: registration_number
        in: query
        required: false
        description: Filtra por `registration_number`. Aceita todos os operadores.
        schema:
          type: array
          items:
            type: string
        style: form
        explode: true
        example:
        - '24100123'
      - name: name
        in: query
        required: false
        description: Filtra por `name`. Aceita todos os operadores.
        schema:
          type: array
          items:
            type: string
        style: form
        explode: true
        example:
        - '{like}%silva%'
      - name: email
        in: query
        required: false
        description: Filtra por `email`. Aceita todos os operadores.
        schema:
          type: array
          items:
            type: string
        style: form
        explode: true
        example:
        - '{like}%@edu.pucrs.br'
      - name: birth_date
        in: query
        required: false
        description: Filtra por `birth_date` (AAAA-MM-DD). Aceita igual, `{neq}`, `{gt}`, `{gteq}`, `{lt}`, `{lteq}`.
        schema:
          type: array
          items:
            type: string
        style: form
        explode: true
        example:
        - '{gteq}2000-01-01'
      - name: phone
        in: query
        required: false
        description: Filtra por `phone`. Aceita todos os operadores.
        schema:
          type: array
          items:
            type: string
        style: form
        explode: true
        example:
        - '{like}5551*'
      - name: honors
        in: query
        required: false
        description: 'Filtra por `honors`. Aceita apenas igual e `{neq}`. Valores: cum laude, magna cum laude, summa cum laude.'
        schema:
          type: array
          items:
            type: string
        style: form
        explode: true
        example:
        - '{neq}cum laude'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Student'
        '400':
          description: 'Bad Request: requisição, JSON ou filtro com erro'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: 'Unauthorized: Authorization ausente, token inválido ou expirado'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: 'Forbidden: o usuário autenticado não tem acesso a esta função'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
