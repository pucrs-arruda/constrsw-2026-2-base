components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        JWT do usuário obtido em `POST http://localhost:8181/login` (API oauth). A BFF propaga `Authorization: Bearer` aos contextos.
  schemas:
    Health:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          const: UP
    Problem:
      type: object
      description: Problema RFC 9457 quando a composição com classes ou reservations falha.
      additionalProperties: false
      required: [type, title, status, detail, code]
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
        instance:
          type: string
          format: uri-reference
        code:
          type: string
          const: BFF-DEPENDENCY
    CurrentSemesterClasses:
      type: array
      description: |
        Classes do semestre em curso devolvidas pelo serviço classes. Array vazio quando não há turma no vínculo.
      items:
        $ref: './grupo01-classes-api.yaml#/components/schemas/Class'
    FutureReservations:
      type: array
      description: |
        Reservations futuras do resource devolvidas pelo serviço reservations. Array vazio quando não há reserva futura.
      items:
        $ref: './grupo03-reservations-api.yaml#/components/schemas/Reservation'
    StudentView:
      title: StudentView
      description: |
        Student do serviço students mais `classes` do semestre em curso. `classes` é normativo nesta BFF, ainda que o schema de domínio feche `additionalProperties`.
      allOf:
        - $ref: './grupo04-students-api.yaml#/components/schemas/Student'
        - type: object
          required: [classes]
          properties:
            classes:
              $ref: '#/components/schemas/CurrentSemesterClasses'
    StudentViewList:
      type: array
      items:
        $ref: '#/components/schemas/StudentView'
    CourseView:
      title: CourseView
      description: |
        Course do serviço courses mais `classes` do semestre em curso. `classes` é normativo nesta BFF, ainda que o schema de domínio feche `additionalProperties`.
      allOf:
        - $ref: './grupo05-courses-api.yaml#/components/schemas/Course'
        - type: object
          required: [classes]
          properties:
            classes:
              $ref: '#/components/schemas/CurrentSemesterClasses'
    CourseViewList:
      type: array
      items:
        $ref: '#/components/schemas/CourseView'
    ResourceView:
      title: ResourceView
      description: |
        Resource do serviço resources mais `reservations` futuras e `openOccurrenceCount`. Ambos são normativos nesta BFF, ainda que o schema de domínio feche `additionalProperties`.
      allOf:
        - $ref: './grupo06-resources-api.yaml#/components/schemas/Resource'
        - type: object
          required: [reservations, openOccurrenceCount]
          properties:
            reservations:
              $ref: '#/components/schemas/FutureReservations'
            openOccurrenceCount:
              type: integer
              minimum: 0
              description: Número de occurrences do resource com status OPEN, calculado pela BFF.
              example: 1
    ResourceViewList:
      type: array
      items:
        $ref: '#/components/schemas/ResourceView'
    ResourceAggregateView:
      title: ResourceAggregateView
      description: |
        Agregado do serviço resources (`occurrences` inclusas) mais `reservations` futuras e `openOccurrenceCount`. Ambos são normativos nesta BFF, ainda que o schema de domínio feche `additionalProperties`.
      allOf:
        - $ref: './grupo06-resources-api.yaml#/components/schemas/ResourceAggregate'
        - type: object
          required: [reservations, openOccurrenceCount]
          properties:
            reservations:
              $ref: '#/components/schemas/FutureReservations'
            openOccurrenceCount:
              type: integer
              minimum: 0
              description: Número de occurrences do resource com status OPEN, calculado pela BFF.
              example: 1
    ProfessorView:
      title: ProfessorView
      description: |
        Professor do serviço professors mais `classes` do semestre em curso e display name do Employee (`employeeId`).
        O vínculo de turmas usa `_id`. `classes`, `employeeName` e `employeeEmail` (quando houver) são normativos nesta BFF;
        o OpenAPI de professors não copia nome/e-mail.
      allOf:
        - $ref: './grupo07-professors-api.yaml#/components/schemas/Professor'
        - type: object
          required: [classes, employeeName]
          properties:
            classes:
              $ref: '#/components/schemas/CurrentSemesterClasses'
            employeeName:
              type: string
              description: Employee.name resolvido pela BFF via employeeId
            employeeEmail:
              type: string
              format: email
              description: Employee.email quando presente; omitido se o Employee não tem e-mail
    ProfessorViewList:
      type: array
      items:
        $ref: '#/components/schemas/ProfessorView'
    RoomView:
      title: RoomView
      description: |
        Room do serviço rooms mais `classes` do semestre em curso. `classes` é normativo nesta BFF, ainda que o schema de domínio feche `additionalProperties`.
      allOf:
        - $ref: './grupo08-rooms-api.yaml#/components/schemas/Room'
        - type: object
          required: [classes]
          properties:
            classes:
              $ref: '#/components/schemas/CurrentSemesterClasses'
    RoomViewList:
      type: array
      items:
        $ref: '#/components/schemas/RoomView'
  responses:
    CompositionUnavailable:
      description: |
        O serviço usado na composição (classes, reservations ou employees na vista Professor) não respondeu. O recurso principal não é devolvido pela metade.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
