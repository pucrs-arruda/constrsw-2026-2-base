        - $ref: './grupo08-rooms-api.yaml#/paths/~1api~1v1~1rooms/get/parameters/8'
      responses:
        '200':
          description: |
            Leitura da BFF com a composição T3.
          headers:
            X-Total-Count:
              $ref: './grupo08-rooms-api.yaml#/paths/~1api~1v1~1rooms/get/responses/200/headers/X-Total-Count'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoomViewList'
        '400':
          $ref: './grupo08-rooms-api.yaml#/paths/~1api~1v1~1rooms/get/responses/400'
        '401':
          $ref: './grupo08-rooms-api.yaml#/paths/~1api~1v1~1rooms/get/responses/401'
        '403':
          $ref: './grupo08-rooms-api.yaml#/paths/~1api~1v1~1rooms/get/responses/403'
        '404':
          $ref: './grupo08-rooms-api.yaml#/paths/~1api~1v1~1rooms/get/responses/404'
        '503':
          $ref: '#/components/responses/CompositionUnavailable'
    post:
      $ref: './grupo08-rooms-api.yaml#/paths/~1api~1v1~1rooms/post'

  '/api/v1/rooms/{id}':
    parameters:
      - $ref: './grupo08-rooms-api.yaml#/paths/~1api~1v1~1rooms~1{id}/parameters/0'
    get:
      tags: [rooms]
      operationId: getRoom
      summary: 'Recupera uma sala e as classes do semestre em curso'
      description: |
        Recupera a sala pelo id, como no serviço rooms, e inclui `classes`: classes sediadas nessa room no semestre em curso (`roomId` igual ao id). Semestre em curso, no fuso America/Sao_Paulo: `year` é o ano civil atual; `semester` é 1 quando o mês é anterior a agosto e 2 quando o mês é agosto ou posterior. O cliente não envia `year` nem `semester`. Sem correspondência, `classes` é um array vazio.

        404 quando o serviço rooms não encontra o id. 503 quando o serviço classes não puder ser consultado.
      responses:
        '200':
          description: |
            Leitura da BFF com a composição T3.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoomView'
        '400':
          $ref: './grupo08-rooms-api.yaml#/paths/~1api~1v1~1rooms~1{id}/get/responses/400'
        '401':
          $ref: './grupo08-rooms-api.yaml#/paths/~1api~1v1~1rooms~1{id}/get/responses/401'
        '403':
          $ref: './grupo08-rooms-api.yaml#/paths/~1api~1v1~1rooms~1{id}/get/responses/403'
        '404':
          $ref: './grupo08-rooms-api.yaml#/paths/~1api~1v1~1rooms~1{id}/get/responses/404'
        '503':
          $ref: '#/components/responses/CompositionUnavailable'
    put:
