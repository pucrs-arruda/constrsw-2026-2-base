# Builds: cada serviço com `build:` compila/embalagem apenas no Dockerfile (não usar artefatos de build da máquina host no lugar do build da imagem). Ver README.md na raiz.
networks:
  constrsw:

volumes:
  # No terminal, criar o volume externo: docker volume create constrsw-keycloak-data
  constrsw-keycloak-data:
    external: true

services:

  # Keycloak
  keycloak:
    container_name: keycloak
    build:
      context: ./infrastructure/dev.local/services/keycloak
      dockerfile: Dockerfile
    image: constrsw/keycloak
    environment:
      - KC_HEALTH_ENABLED=${KC_HEALTH_ENABLED}
      - KC_METRICS_ENABLED=${KC_METRICS_ENABLED}
      - KC_HTTP_MANAGEMENT_PORT=${KC_HTTP_MANAGEMENT_PORT}
      - KEYCLOAK_ADMIN=${KEYCLOAK_ADMIN}
      - KEYCLOAK_ADMIN_PASSWORD=${KEYCLOAK_ADMIN_PASSWORD}
    volumes:
      # No terminal, criar o volume externo: docker volume create constrsw-keycloak-data
      - constrsw-keycloak-data:/opt/keycloak/data
      - ./infrastructure/dev.local/services/keycloak:/opt/keycloak/data/import
    networks:
      - constrsw
    ports:
      - ${KEYCLOAK_EXTERNAL_CONSOLE_PORT}:${KEYCLOAK_INTERNAL_CONSOLE_PORT}
      - ${KEYCLOAK_EXTERNAL_METRICS_PORT}:${KEYCLOAK_INTERNAL_METRICS_PORT}
    command: start-dev --import-realm
    restart: always
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -f ${KEYCLOAK_INTERNAL_HOST}:${KEYCLOAK_INTERNAL_METRICS_PORT}/health",
        ]
      start_period: 0s
      interval: 20s
      timeout: 10s
      retries: 20

  # Auth - Keycloak Gateway API
  oauth:
    container_name: oauth
    build:
      context: ./backend/oauth
      dockerfile: Dockerfile
    image: constrsw/oauth
    environment:
      - KEYCLOAK_SERVER_URL=${KEYCLOAK_SERVER_URL}
      - KEYCLOAK_REALM=${KEYCLOAK_REALM}
      - KEYCLOAK_CLIENT_ID=${KEYCLOAK_CLIENT_ID}
      - KEYCLOAK_CLIENT_SECRET=${KEYCLOAK_CLIENT_SECRET}
      - OAUTH_INTERNAL_PROTOCOL=${OAUTH_INTERNAL_PROTOCOL}
      - OAUTH_INTERNAL_HOST=${OAUTH_INTERNAL_HOST}
      - OAUTH_INTERNAL_API_PORT=${OAUTH_INTERNAL_API_PORT}
      - OAUTH_INTERNAL_DEBUG_PORT=${OAUTH_INTERNAL_DEBUG_PORT}
      - OAUTH_INTERNAL_METRICS_PORT=${OAUTH_INTERNAL_METRICS_PORT}
    ports:
      - "${OAUTH_EXTERNAL_API_PORT}:${OAUTH_INTERNAL_API_PORT}"
      - "${OAUTH_EXTERNAL_DEBUG_PORT}:${OAUTH_INTERNAL_DEBUG_PORT}"
      - "${OAUTH_EXTERNAL_METRICS_PORT}:${OAUTH_INTERNAL_METRICS_PORT}"
    networks:
      - constrsw
    depends_on:
      keycloak:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "-f",
          "http://127.0.0.1:${OAUTH_INTERNAL_METRICS_PORT}/actuator/health",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: always

  # Prometheus - coleta metricas da API oauth e do Keycloak
  prometheus:
    container_name: prometheus
    image: prom/prometheus:v2.55.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
      - --web.enable-lifecycle
    volumes:
      - ./infrastructure/dev.local/services/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infrastructure/dev.local/services/prometheus/alert.rules.yml:/etc/prometheus/alert.rules.yml:ro
    ports:
      - "${PROMETHEUS_EXTERNAL_PORT}:${PROMETHEUS_INTERNAL_PORT}"
    networks:
      - constrsw
    depends_on:
      - keycloak
      - oauth
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:${PROMETHEUS_INTERNAL_PORT}/-/healthy"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: always

  # Grafana - dashboards sobre as metricas do Prometheus
  grafana:
    container_name: grafana
    image: grafana/grafana:11.3.0
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
      - GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH=/var/lib/grafana/dashboards/oauth-overview.json
      - GF_USERS_DEFAULT_LANGUAGE=pt-BR
    volumes:
      - ./infrastructure/dev.local/services/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infrastructure/dev.local/services/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "${GRAFANA_EXTERNAL_PORT}:${GRAFANA_INTERNAL_PORT}"
    networks:
      - constrsw
    depends_on:
      - prometheus
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:${GRAFANA_INTERNAL_PORT}/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: always
