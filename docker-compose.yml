# Builds: cada serviço com `build:` compila/embalagem apenas no Dockerfile (não usar artefatos de build da máquina host no lugar do build da imagem). Ver README.md na raiz.
networks:
  constrsw:

volumes:
  # No terminal, criar o volume externo: docker volume create constrsw-prometheus-data
  constrsw-prometheus-data:
    external: true
  # No terminal, criar o volume externo: docker volume create constrsw-keycloak-data
  constrsw-keycloak-data:
    external: true
  # No terminal, criar o volume externo: docker volume create constrsw-postgresql-data
  constrsw-postgresql-data:
    external: true
  # No terminal, criar o volume externo: docker volume create constrsw-mongodb-data
  constrsw-mongodb-data:
    external: true

services:

  # Prometheus
  prometheus:
    container_name: prometheus
    build:
      context: ./infrastructure/dev.local/services/prometheus
      dockerfile: Dockerfile
    image: constrsw/prometheus
    environment:
      - PROMETHEUS_INTERNAL_HOST=${PROMETHEUS_INTERNAL_HOST}
      - PROMETHEUS_EXTERNAL_HOST=${PROMETHEUS_EXTERNAL_HOST}
      - PROMETHEUS_INTERNAL_PORT=${PROMETHEUS_INTERNAL_PORT}
      - PROMETHEUS_EXTERNAL_PORT=${PROMETHEUS_EXTERNAL_PORT}
    volumes:
      - constrsw-prometheus-data:/prometheus
      - ./infrastructure/dev.local/services/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./infrastructure/dev.local/services/prometheus/alerts.yml:/etc/prometheus/alerts.yml
    networks:
      - constrsw
    ports:
      - ${PROMETHEUS_EXTERNAL_PORT}:${PROMETHEUS_INTERNAL_PORT}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: always

  # OpenTelemetry Collector
  otel-collector:
    container_name: otel-collector
    build:
      context: ./infrastructure/dev.local/services/otel-collector
      dockerfile: Dockerfile
    image: constrsw/otel-collector
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./infrastructure/dev.local/services/otel-collector/otel-collector-config.yml:/etc/otelcol/config.yaml
    ports:
      - "4317:4317"   # OTLP gRPC receiver
      - "4318:4318"   # OTLP HTTP receiver
      - "8888:8888"   # Prometheus metrics endpoint
      - "8889:8889"   # Prometheus exporter
    networks:
      - constrsw
    depends_on:
      - prometheus
    restart: always

  # Blackbox Exporter (para monitoramento de health checks)
  blackbox-exporter:
    container_name: blackbox-exporter
    image: prom/blackbox-exporter:latest
    volumes:
      - ./infrastructure/dev.local/services/prometheus/blackbox.yml:/etc/blackbox_exporter/config.yml
    networks:
      - constrsw
    ports:
      - "9115:9115"
    restart: always

  # Keycloak
  keycloak:
    container_name: keycloak
    build:
      context: ./infrastructure/dev.local/services/keycloak
      dockerfile: Dockerfile
    image: constrsw/keycloak
    environment:
      - KC_HEALTH_ENABLED=${KC_HEALTH_ENABLED}
      - KC_METRICS_ENABLED=${KC_METRICS_ENABLED}
      - KC_HTTP_MANAGEMENT_PORT=${KC_HTTP_MANAGEMENT_PORT}
      - KEYCLOAK_ADMIN=${KEYCLOAK_ADMIN}
      - KEYCLOAK_ADMIN_PASSWORD=${KEYCLOAK_ADMIN_PASSWORD}
      - JAVA_OPTS_APPEND=-XX:+IgnoreUnrecognizedVMOptions -XX:UseSVE=0
    volumes:
      # No terminal, criar o volume externo: docker volume create constrsw-keycloak-data
      - constrsw-keycloak-data:/opt/keycloak/data
      - ./infrastructure/dev.local/services/keycloak:/opt/keycloak/data/import
    networks:
      - constrsw
    ports:
      - ${KEYCLOAK_EXTERNAL_CONSOLE_PORT}:${KEYCLOAK_INTERNAL_CONSOLE_PORT}
      - ${KEYCLOAK_EXTERNAL_METRICS_PORT}:${KEYCLOAK_INTERNAL_METRICS_PORT}
    command: start-dev --import-realm
    restart: always
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -f ${KEYCLOAK_INTERNAL_HOST}:${KEYCLOAK_INTERNAL_METRICS_PORT}/health",
        ]
      start_period: 0s
      interval: 20s
      timeout: 10s
      retries: 20

  # OAuth - Keycloak Gateway API
  oauth:
    container_name: oauth
    build:
      context: ./backend/oauth
      dockerfile: Dockerfile
    image: constrsw/oauth
    environment:
      - PORT=${OAUTH_INTERNAL_API_PORT}
      - NODE_ENV=${OAUTH_NODE_ENV}
      - KEYCLOAK_URL=${KEYCLOAK_SERVER_URL}
      - KEYCLOAK_REALM=${KEYCLOAK_REALM}
      - KEYCLOAK_CLIENT_ID=${KEYCLOAK_CLIENT_ID}
      - KEYCLOAK_CLIENT_SECRET=${KEYCLOAK_CLIENT_SECRET}
      - KEYCLOAK_TIMEOUT_MS=${OAUTH_KEYCLOAK_TIMEOUT_MS}
      - KEYCLOAK_ADMIN_CLIENT_ID=${OAUTH_KEYCLOAK_ADMIN_CLIENT_ID}
      - KEYCLOAK_ADMIN_CLIENT_SECRET=${OAUTH_KEYCLOAK_ADMIN_CLIENT_SECRET}
      - SESSION_COOKIE_NAME=${OAUTH_SESSION_COOKIE_NAME}
      - COOKIE_SECURE=${OAUTH_COOKIE_SECURE}
      - COOKIE_SAME_SITE=${OAUTH_COOKIE_SAME_SITE}
      - OAUTH_INTERNAL_API_PORT=${OAUTH_INTERNAL_API_PORT}
    ports:
      - "${OAUTH_EXTERNAL_API_PORT}:${OAUTH_INTERNAL_API_PORT}"
      - "${OAUTH_EXTERNAL_DEBUG_PORT}:${OAUTH_INTERNAL_DEBUG_PORT}"
      - "${OAUTH_EXTERNAL_METRICS_PORT}:${OAUTH_INTERNAL_METRICS_PORT}"
    networks:
      - constrsw
    depends_on:
      keycloak:
        condition: service_healthy
      otel-collector:
        condition: service_started
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://127.0.0.1:'+(process.env.OAUTH_INTERNAL_API_PORT)+'/health',(r)=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: always

  # PostgreSQL
  postgresql:
    container_name: postgresql
    build:
      context: ./infrastructure/dev.local/services/postgresql
      dockerfile: Dockerfile
      args:
        POSTGRESQL_HOST_AUTH_METHOD: ${POSTGRESQL_HOST_AUTH_METHOD}
        POSTGRESQL_DATA: ${POSTGRESQL_DATA}
        POSTGRESQL_USERNAME: ${POSTGRESQL_USERNAME}
        POSTGRESQL_PASSWORD: ${POSTGRESQL_PASSWORD}
    image: constrsw/postgresql
    environment:
      - POSTGRESQL_INTERNAL_HOST=${POSTGRESQL_INTERNAL_HOST}
      - POSTGRESQL_INTERNAL_PORT=${POSTGRESQL_INTERNAL_PORT}
      - POSTGRES_USER=${POSTGRESQL_USERNAME}
      - POSTGRES_PASSWORD=${POSTGRESQL_PASSWORD}
      - POSTGRESQL_DB=${POSTGRESQL_DB}
    volumes:
      # No terminal, criar o volume externo: docker volume create constrsw-postgresql-data
      - constrsw-postgresql-data:${POSTGRESQL_DATA}
    networks:
      - constrsw
    ports:
      - ${POSTGRESQL_EXTERNAL_PORT}:${POSTGRESQL_INTERNAL_PORT}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRESQL_USERNAME}"]
      start_period: 0s
      interval: 10s
      timeout: 10s
      retries: 10
    restart: always

  # PostgreSQL Exporter para o Prometheus
  postgresql-exporter:
    image: prometheuscommunity/postgres-exporter:latest
    container_name: postgresql-exporter
    environment:
      - DATA_SOURCE_NAME=postgresql://${POSTGRESQL_USERNAME}:${POSTGRESQL_PASSWORD}@${POSTGRESQL_INTERNAL_HOST}:${POSTGRESQL_INTERNAL_PORT}/${POSTGRESQL_DB}?sslmode=disable
    ports:
      - "9187:9187"
    networks:
      - constrsw
    depends_on:
      postgresql:
        condition: service_healthy
    restart: always

  # MongoDB
  mongodb:
    container_name: mongodb
    build:
      context: ./infrastructure/dev.local/services/mongodb
      dockerfile: Dockerfile
      args:
        - MONGO_INITDB_ROOT_USERNAME=${MONGODB_USERNAME}
        - MONGO_INITDB_ROOT_PASSWORD=${MONGODB_PASSWORD}
    image: constrsw/mongodb
    environment:
      - MONGODB_USERNAME=${MONGODB_USERNAME}
      - MONGODB_PASSWORD=${MONGODB_PASSWORD}
      - MONGODB_INTERNAL_HOST=${MONGODB_INTERNAL_HOST}
      - MONGODB_INTERNAL_PORT=${MONGODB_INTERNAL_PORT}
    volumes:
      # No terminal, criar o volume externo: docker volume create constrsw-mongodb-data
      - constrsw-mongodb-data:/data/mongodb
    networks:
      - constrsw
    ports:
      - ${MONGODB_EXTERNAL_PORT}:${MONGODB_INTERNAL_PORT}
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mongosh --quiet mongodb://${MONGODB_USERNAME}:${MONGODB_PASSWORD}@${MONGODB_INTERNAL_HOST}:${MONGODB_INTERNAL_PORT}/constrsw --eval 'quit(db.runCommand({ ping: 1 }).ok ? 0 : 2)'",
        ]
      start_period: 0s
      interval: 20s
      timeout: 10s
      retries: 20
    restart: always

  # MongoDB Exporter para o Prometheus
  mongodb-exporter:
    image: percona/mongodb_exporter:0.40.0
    container_name: mongodb-exporter
    command:
      - '--mongodb.uri=mongodb://${MONGODB_USERNAME}:${MONGODB_PASSWORD}@${MONGODB_INTERNAL_HOST}:${MONGODB_INTERNAL_PORT}/?authSource=${MONGODB_DB}'
      - '--web.listen-address=:9216'
      - '--collect-all'
      - '--compatible-mode'
    ports:
      - "9216:9216"
    networks:
      - constrsw
    depends_on:
      mongodb:
        condition: service_healthy
    restart: always

  # Employees Service
  employees:
    container_name: employees
    build:
      context: ./backend/employees
      dockerfile: Dockerfile
    image: constrsw/employees
    environment:
      - PORT=${EMPLOYEES_INTERNAL_API_PORT}
      - MONGODB_URI=${EMPLOYEES_MONGODB_URI}
      - OAUTH_BASE_URL=${EMPLOYEES_OAUTH_BASE_URL}
      - OAUTH_JWKS_PATH=${EMPLOYEES_OAUTH_JWKS_PATH}
      - JWT_ISSUER=${EMPLOYEES_JWT_ISSUER}
      - JWT_AUDIENCE=${EMPLOYEES_JWT_AUDIENCE}
      - JWT_CLIENT_AUDIENCE=${EMPLOYEES_JWT_CLIENT_AUDIENCE}
    ports:
      - "${EMPLOYEES_EXTERNAL_API_PORT}:${EMPLOYEES_INTERNAL_API_PORT}"
      - "${EMPLOYEES_EXTERNAL_DEBUG_PORT}:${EMPLOYEES_INTERNAL_DEBUG_PORT}"
      - "${EMPLOYEES_EXTERNAL_METRICS_PORT}:${EMPLOYEES_INTERNAL_METRICS_PORT}"
    networks:
      - constrsw
    depends_on:
      mongodb:
        condition: service_healthy
      oauth:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -f http://127.0.0.1:${EMPLOYEES_INTERNAL_API_PORT}/api/v1/health || exit 1",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: always

  # Classes Services
  classes:
    container_name: classes
    build:
      context: ./backend/classes
      dockerfile: Dockerfile
    image: constrsw/classes
    environment:
      - CLASSES_INTERNAL_API_PORT=${CLASSES_INTERNAL_API_PORT}
      - DATABASE_URL=${CLASSES_DATABASE_URL}
      - DATABASE_USERNAME=${CLASSES_USERNAME}
      - DATABASE_PASSWORD=${CLASSES_PASSWORD}
      - KEYCLOAK_JWKS_URL=${KEYCLOAK_JWKS_URL}
    ports:
      - "${CLASSES_EXTERNAL_API_PORT}:${CLASSES_INTERNAL_API_PORT}"
      - "${CLASSES_EXTERNAL_DEBUG_PORT}:${CLASSES_INTERNAL_DEBUG_PORT}"
      - "${CLASSES_EXTERNAL_METRICS_PORT}:${CLASSES_INTERNAL_METRICS_PORT}"
    networks:
      - constrsw
    depends_on:
      postgresql:
        condition: service_healthy
      oauth:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:${CLASSES_INTERNAL_API_PORT}/api/v1/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: always

  # Courses Services
  courses:
    container_name: courses
    build:
      context: ./backend/courses
      dockerfile: Dockerfile
    image: constrsw/courses
    environment:
      - SERVER_PORT=${COURSES_INTERNAL_API_PORT}
      - DATABASE_URL=${COURSES_DATABASE_URL}
      - DATABASE_USER=${COURSES_USERNAME}
      - DATABASE_PASSWORD=${COURSES_PASSWORD}
      - OAUTH_VALIDATION_URL=${COURSES_OAUTH_VALIDATION_URL}
    ports:
      - "${COURSES_EXTERNAL_API_PORT}:${COURSES_INTERNAL_API_PORT}"
      - "${COURSES_EXTERNAL_DEBUG_PORT}:${COURSES_INTERNAL_DEBUG_PORT}"
      - "${COURSES_EXTERNAL_METRICS_PORT}:${COURSES_INTERNAL_METRICS_PORT}"
    networks:
      - constrsw
    depends_on:
      postgresql:
        condition: service_healthy
      oauth:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:${COURSES_INTERNAL_API_PORT}/api/v1/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: always

  # Lessons Services
  lessons:
    container_name: lessons
    build:
      context: ./backend/lessons
      dockerfile: Dockerfile
    image: constrsw/lessons
    environment:
      - SERVER_PORT=${LESSONS_INTERNAL_API_PORT}
      - MANAGEMENT_SERVER_PORT=${LESSONS_INTERNAL_METRICS_PORT}
      - MANAGEMENT_ENDPOINTS_WEB_BASE_PATH=${LESSONS_MANAGEMENT_BASE_PATH}
      - DB_HOST=${POSTGRESQL_INTERNAL_HOST}
      - DB_PORT=${POSTGRESQL_INTERNAL_PORT}
      - DB_NAME=${LESSONS_DB}
      - DB_USER=${LESSONS_USERNAME}
      - DB_PASSWORD=${LESSONS_PASSWORD}
      - LESSONS_JWT_ISSUER=${LESSONS_JWT_ISSUER}
      - LESSONS_JWKS_URI=${LESSONS_JWKS_URI}
      - LESSONS_JWT_AUDIENCE=${LESSONS_JWT_AUDIENCE}
      - LESSONS_CLASSES_URL=${LESSONS_CLASSES_URL}
      - LESSONS_SYLLABUS_ITEMS_URL=${LESSONS_SYLLABUS_ITEMS_URL}
      - LESSONS_RESERVATIONS_URL=${LESSONS_RESERVATIONS_URL}
      - LESSONS_HTTP_TIMEOUT_MS=${LESSONS_HTTP_TIMEOUT_MS}
    ports:
      - "${LESSONS_EXTERNAL_API_PORT}:${LESSONS_INTERNAL_API_PORT}"
      - "${LESSONS_EXTERNAL_DEBUG_PORT}:${LESSONS_INTERNAL_DEBUG_PORT}"
      - "${LESSONS_EXTERNAL_METRICS_PORT}:${LESSONS_INTERNAL_METRICS_PORT}"
    networks:
      - constrsw
    depends_on:
      postgresql:
        condition: service_healthy
      oauth:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:${LESSONS_INTERNAL_METRICS_PORT}/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: always

  # Professors Services
  professors:
    container_name: professors
    build:
      context: ./backend/professors
      dockerfile: Dockerfile
    image: constrsw/professors
    environment:
      - PORT=${PROFESSORS_INTERNAL_API_PORT}
      - NODE_ENV=${PROFESSORS_NODE_ENV}
      - DATABASE_URL=${PROFESSORS_DATABASE_URL}
      - JWKS_URL=${KEYCLOAK_JWKS_URL}
      - JWT_ISSUER=${KEYCLOAK_ISSUER}
      - JWT_AUDIENCE=${JWT_AUDIENCE}
      - KEYCLOAK_REALM=${KEYCLOAK_REALM}
    ports:
      - "${PROFESSORS_EXTERNAL_API_PORT}:${PROFESSORS_INTERNAL_API_PORT}"
      - "${PROFESSORS_EXTERNAL_DEBUG_PORT}:${PROFESSORS_INTERNAL_DEBUG_PORT}"
      - "${PROFESSORS_EXTERNAL_METRICS_PORT}:${PROFESSORS_INTERNAL_METRICS_PORT}"
    networks:
      - constrsw
    depends_on:
      postgresql:
        condition: service_healthy
      oauth:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://127.0.0.1:'+(process.env.PORT)+'/api/v1/health',(r)=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: always

  # Reservations Services
  reservations:
    container_name: reservations
    build:
      context: ./backend/reservations
      dockerfile: Dockerfile
    image: constrsw/reservations
    environment:
      - RESERVATIONS_INTERNAL_API_PORT=${RESERVATIONS_INTERNAL_API_PORT}
      - DB_URL=${RESERVATIONS_DATABASE_URL}
      - DB_USER=${RESERVATIONS_USERNAME}
      - DB_PASSWORD=${RESERVATIONS_PASSWORD}
      - KEYCLOAK_JWKS_URI=${KEYCLOAK_JWKS_URL}
      - KEYCLOAK_ALLOWED_ISSUERS=${KEYCLOAK_ALLOWED_ISSUERS}
    ports:
      - "${RESERVATIONS_EXTERNAL_API_PORT}:${RESERVATIONS_INTERNAL_API_PORT}"
      - "${RESERVATIONS_EXTERNAL_DEBUG_PORT}:${RESERVATIONS_INTERNAL_DEBUG_PORT}"
      - "${RESERVATIONS_EXTERNAL_METRICS_PORT}:${RESERVATIONS_INTERNAL_METRICS_PORT}"
    networks:
      - constrsw
    depends_on:
      postgresql:
        condition: service_healthy
      oauth:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:${RESERVATIONS_INTERNAL_API_PORT}/api/v1/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: always

  # Resources Services
  resources:
    container_name: resources
    build:
      context: ./backend/resources
      dockerfile: Dockerfile
    image: constrsw/resources
    environment:
      - PORT=${RESOURCES_INTERNAL_API_PORT}
      - NODE_ENV=${RESOURCES_NODE_ENV}
      - DATABASE_URL=${RESOURCES_DATABASE_URL}
      - DB_SSL=${RESOURCES_DB_SSL}
      - KEYCLOAK_JWKS_URL=${KEYCLOAK_JWKS_URL}
      - KEYCLOAK_ISSUER=${KEYCLOAK_ISSUER}
      - JWT_AUDIENCE=${JWT_AUDIENCE}
    ports:
      - "${RESOURCES_EXTERNAL_API_PORT}:${RESOURCES_INTERNAL_API_PORT}"
      - "${RESOURCES_EXTERNAL_DEBUG_PORT}:${RESOURCES_INTERNAL_DEBUG_PORT}"
      - "${RESOURCES_EXTERNAL_METRICS_PORT}:${RESOURCES_INTERNAL_METRICS_PORT}"
    networks:
      - constrsw
    depends_on:
      postgresql:
        condition: service_healthy
      oauth:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://127.0.0.1:'+(process.env.PORT)+'/api/v1/health',(r)=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: always

  # Rooms Services
  rooms:
    container_name: rooms
    build:
      context: ./backend/rooms
      dockerfile: Dockerfile
    image: constrsw/rooms
    environment:
      - ROOMS_INTERNAL_API_PORT=${ROOMS_INTERNAL_API_PORT}
      - DB_URL=${ROOMS_DATABASE_URL}
      - DB_USER=${ROOMS_USERNAME}
      - DB_PASSWORD=${ROOMS_PASSWORD}
      - KEYCLOAK_JWKS_URL=${KEYCLOAK_JWKS_URL}
      - KEYCLOAK_ALLOWED_ISSUERS=${KEYCLOAK_ALLOWED_ISSUERS}
      - MANAGEMENT_PORT=${ROOMS_INTERNAL_METRICS_PORT}
    ports:
      - "${ROOMS_EXTERNAL_API_PORT}:${ROOMS_INTERNAL_API_PORT}"
      - "${ROOMS_EXTERNAL_DEBUG_PORT}:${ROOMS_INTERNAL_DEBUG_PORT}"
      - "${ROOMS_EXTERNAL_METRICS_PORT}:${ROOMS_INTERNAL_METRICS_PORT}"
    networks:
      - constrsw
    depends_on:
      postgresql:
        condition: service_healthy
      oauth:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:${ROOMS_INTERNAL_METRICS_PORT}/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: always

  # Students Services
  students:
    container_name: students
    build:
      context: ./backend/students
      dockerfile: Dockerfile
    image: constrsw/students
    environment:
      - STUDENTS_INTERNAL_API_PORT=${STUDENTS_INTERNAL_API_PORT}
      - DB_HOST=${POSTGRESQL_INTERNAL_HOST}
      - DB_PORT=${POSTGRESQL_INTERNAL_PORT}
      - DB_NAME=${STUDENTS_DB}
      - DB_USER=${STUDENTS_USERNAME}
      - DB_PASSWORD=${STUDENTS_PASSWORD}
      - KEYCLOAK_SERVER_URL=${KEYCLOAK_SERVER_URL}
      - KEYCLOAK_REALM=${KEYCLOAK_REALM}
    ports:
      - "${STUDENTS_EXTERNAL_API_PORT}:${STUDENTS_INTERNAL_API_PORT}"
      - "${STUDENTS_EXTERNAL_DEBUG_PORT}:${STUDENTS_INTERNAL_DEBUG_PORT}"
      - "${STUDENTS_EXTERNAL_METRICS_PORT}:${STUDENTS_INTERNAL_METRICS_PORT}"
    networks:
      - constrsw
    depends_on:
      postgresql:
        condition: service_healthy
      oauth:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:${STUDENTS_INTERNAL_API_PORT}/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: always

  # BFF (Backend for Frontend) Service
  bff:
    container_name: api
    build:
      context: ./backend/bff
      dockerfile: Dockerfile
    image: constrsw/bff
    environment:
      - PORT=${BFF_INTERNAL_API_PORT}
      - APP_ENV=${BFF_APP_ENV}
      - APP_VERSION=${BFF_APP_VERSION}
      - OAUTH_BASE_URL=${BFF_OAUTH_BASE_URL}
      - OAUTH_JWKS_PATH=${BFF_OAUTH_JWKS_PATH}
      - OAUTH_VALIDATE_PATH=${BFF_OAUTH_VALIDATE_PATH}
      - JWT_ISSUER=${BFF_JWT_ISSUER}
      - JWT_AUDIENCE=${BFF_JWT_AUDIENCE}
      - JWT_CLIENT_AUDIENCE=${BFF_JWT_CLIENT_AUDIENCE}
      - CLASSES_BASE_URL=${BFF_CLASSES_BASE_URL}
      - COURSES_BASE_URL=${BFF_COURSES_BASE_URL}
      - EMPLOYEES_BASE_URL=${BFF_EMPLOYEES_BASE_URL}
      - LESSONS_BASE_URL=${BFF_LESSONS_BASE_URL}
      - PROFESSORS_BASE_URL=${BFF_PROFESSORS_BASE_URL}
      - RESERVATIONS_BASE_URL=${BFF_RESERVATIONS_BASE_URL}
      - RESOURCES_BASE_URL=${BFF_RESOURCES_BASE_URL}
      - ROOMS_BASE_URL=${BFF_ROOMS_BASE_URL}
      - BFF_HTTP_TIMEOUT_MS=${BFF_HTTP_TIMEOUT_MS}
      - BFF_HTTP_RETRIES=${BFF_HTTP_RETRIES}
      - BFF_CIRCUIT_BREAKER_TIMEOUT_MS=${BFF_CIRCUIT_BREAKER_TIMEOUT_MS}
      - BFF_CIRCUIT_BREAKER_ERROR_THRESHOLD_PERCENTAGE=${BFF_CIRCUIT_BREAKER_ERROR_THRESHOLD_PERCENTAGE}
      - BFF_CIRCUIT_BREAKER_RESET_TIMEOUT_MS=${BFF_CIRCUIT_BREAKER_RESET_TIMEOUT_MS}
      - BFF_CIRCUIT_BREAKER_VOLUME_THRESHOLD=${BFF_CIRCUIT_BREAKER_VOLUME_THRESHOLD}
      - BFF_CIRCUIT_BREAKER_ROLLING_WINDOW_MS=${BFF_CIRCUIT_BREAKER_ROLLING_WINDOW_MS}
      - OTEL_SERVICE_NAME=${BFF_OTEL_SERVICE_NAME}
      - BFF_INTERNAL_METRICS_PORT=${BFF_INTERNAL_METRICS_PORT}
      - OTEL_EXPORTER_OTLP_METRICS_ENDPOINT=${OTEL_EXPORTER_OTLP_METRICS_ENDPOINT}
      - OTEL_EXPORTER_OTLP_TRACES_ENDPOINT=${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT}
      - NODE_OPTIONS=${BFF_NODE_OPTIONS}
    ports:
      - "${BFF_EXTERNAL_API_PORT}:${BFF_INTERNAL_API_PORT}"
      - "${BFF_EXTERNAL_DEBUG_PORT}:${BFF_INTERNAL_DEBUG_PORT}"
      - "${BFF_EXTERNAL_METRICS_PORT}:${BFF_INTERNAL_METRICS_PORT}"
    networks:
      - constrsw
    depends_on:
      oauth:
        condition: service_healthy
      employees:
        condition: service_healthy
      professors:
        condition: service_healthy
      resources:
        condition: service_started
      otel-collector:
        condition: service_started
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://127.0.0.1:'+(process.env.PORT)+'/health',(r)=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 25s
    restart: always

  # Frontend — Closed CRAS SPA
  frontend:
    container_name: frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_OAUTH_BASE_URL: ${VITE_OAUTH_BASE_URL}
        VITE_BFF_BASE_URL: ${VITE_BFF_BASE_URL}
    image: constrsw/frontend
    ports:
      - "${FRONTEND_EXTERNAL_PORT}:${FRONTEND_INTERNAL_PORT}"
    networks:
      - constrsw
    depends_on:
      oauth:
        condition: service_healthy
      bff:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -f http://127.0.0.1/health || exit 1",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: always
