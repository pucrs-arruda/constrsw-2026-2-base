# Builds: cada serviço com `build:` compila/embalagem apenas no Dockerfile (não usar artefatos de build da máquina host no lugar do build da imagem). Ver README.md na raiz.
networks:
  constrsw:

volumes:
  # No terminal, criar o volume externo: docker volume create constrsw-prometheus-data
  constrsw-prometheus-data:
    external: true
  # No terminal, criar o volume externo: docker volume create constrsw-keycloak-data
  constrsw-keycloak-data:
    external: true
  # Banco do contexto resources (criado automaticamente pelo compose)
  constrsw-resources-data:

services:

  # Prometheus
  prometheus:
    container_name: prometheus
    build:
      context: ./infrastructure/dev.local/services/prometheus
      dockerfile: Dockerfile
    image: constrsw/prometheus
    environment:
      - PROMETHEUS_INTERNAL_HOST=${PROMETHEUS_INTERNAL_HOST}
      - PROMETHEUS_EXTERNAL_HOST=${PROMETHEUS_EXTERNAL_HOST}
      - PROMETHEUS_INTERNAL_PORT=${PROMETHEUS_INTERNAL_PORT}
      - PROMETHEUS_EXTERNAL_PORT=${PROMETHEUS_EXTERNAL_PORT}
    volumes:
      - constrsw-prometheus-data:/prometheus
      - ./infrastructure/dev.local/services/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./infrastructure/dev.local/services/prometheus/alerts.yml:/etc/prometheus/alerts.yml
      - ./infrastructure/dev.local/services/prometheus/recording_rules.yml:/etc/prometheus/recording_rules.yml
    networks:
      - constrsw
    ports:
      - ${PROMETHEUS_EXTERNAL_PORT}:${PROMETHEUS_INTERNAL_PORT}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: always

  # OpenTelemetry Collector
  otel-collector:
    container_name: otel-collector
    build:
      context: ./infrastructure/dev.local/services/otel-collector
      dockerfile: Dockerfile
    image: constrsw/otel-collector
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./infrastructure/dev.local/services/otel-collector/otel-collector-config.yml:/etc/otelcol/config.yaml
    ports:
      - "4317:4317"   # OTLP gRPC receiver
      - "4318:4318"   # OTLP HTTP receiver
      - "8888:8888"   # Prometheus metrics endpoint
      - "8889:8889"   # Prometheus exporter
    networks:
      - constrsw
    depends_on:
      - prometheus
    restart: always

  # Blackbox Exporter (para monitoramento de health checks)
  blackbox-exporter:
    container_name: blackbox-exporter
    image: prom/blackbox-exporter:latest
    volumes:
      - ./infrastructure/dev.local/services/prometheus/blackbox.yml:/etc/blackbox_exporter/config.yml
    networks:
      - constrsw
    ports:
      - "9115:9115"
    restart: always

  # Keycloak
  keycloak:
    container_name: keycloak
    build:
      context: ./infrastructure/dev.local/services/keycloak
      dockerfile: Dockerfile
    image: constrsw/keycloak
    environment:
      - KC_HEALTH_ENABLED=${KC_HEALTH_ENABLED}
      - KC_METRICS_ENABLED=${KC_METRICS_ENABLED}
      - KC_HTTP_MANAGEMENT_PORT=${KC_HTTP_MANAGEMENT_PORT}
      - KEYCLOAK_ADMIN=${KEYCLOAK_ADMIN}
      - KEYCLOAK_ADMIN_PASSWORD=${KEYCLOAK_ADMIN_PASSWORD}
    volumes:
      # No terminal, criar o volume externo: docker volume create constrsw-keycloak-data
      - constrsw-keycloak-data:/opt/keycloak/data
      - ./infrastructure/dev.local/services/keycloak:/opt/keycloak/data/import
    networks:
      - constrsw
    ports:
      - ${KEYCLOAK_EXTERNAL_CONSOLE_PORT}:${KEYCLOAK_INTERNAL_CONSOLE_PORT}
      - ${KEYCLOAK_EXTERNAL_METRICS_PORT}:${KEYCLOAK_INTERNAL_METRICS_PORT}
    command: start-dev --import-realm
    restart: always
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -f ${KEYCLOAK_INTERNAL_HOST}:${KEYCLOAK_INTERNAL_METRICS_PORT}/health",
        ]
      start_period: 0s
      interval: 20s
      timeout: 10s
      retries: 20

  # Auth - Keycloak Gateway API
  oauth:
    container_name: oauth
    build:
      context: ./backend/oauth
      dockerfile: Dockerfile
    image: constrsw/oauth
    environment:
      - PORT=${OAUTH_INTERNAL_API_PORT}
      - NODE_ENV=development
      - PUBLIC_API_URL=${OAUTH_EXTERNAL_PROTOCOL}://${OAUTH_EXTERNAL_HOST}:${OAUTH_EXTERNAL_API_PORT}
      - PUBLIC_KEYCLOAK_URL=${KEYCLOAK_EXTERNAL_PROTOCOL}://${KEYCLOAK_EXTERNAL_HOST}:${KEYCLOAK_EXTERNAL_CONSOLE_PORT}
      - KEYCLOAK_URL=${KEYCLOAK_SERVER_URL}
      - KEYCLOAK_REALM=${KEYCLOAK_REALM}
      - KEYCLOAK_CLIENT_ID=${KEYCLOAK_CLIENT_ID}
      - KEYCLOAK_CLIENT_SECRET=${KEYCLOAK_CLIENT_SECRET}
      - KEYCLOAK_TIMEOUT_MS=5000
      - KEYCLOAK_ADMIN=${KEYCLOAK_ADMIN}
      - KEYCLOAK_ADMIN_PASSWORD=${KEYCLOAK_ADMIN_PASSWORD}
      - KEYCLOAK_ADMIN_CLIENT_ID=${OAUTH_ADMIN_CLIENT_ID}
      - KEYCLOAK_ADMIN_CLIENT_SECRET=${OAUTH_ADMIN_CLIENT_SECRET}
      - SESSION_COOKIE_NAME=${OAUTH_SESSION_COOKIE_NAME}
      - COOKIE_SECURE=false
      - COOKIE_SAME_SITE=lax
      - OAUTH_INTERNAL_PROTOCOL=${OAUTH_INTERNAL_PROTOCOL}
      - OAUTH_INTERNAL_HOST=${OAUTH_INTERNAL_HOST}
      - OAUTH_INTERNAL_API_PORT=${OAUTH_INTERNAL_API_PORT}
      - OAUTH_INTERNAL_DEBUG_PORT=${OAUTH_INTERNAL_DEBUG_PORT}
      - OAUTH_INTERNAL_METRICS_PORT=${OAUTH_INTERNAL_METRICS_PORT}
    ports:
      - "${OAUTH_EXTERNAL_API_PORT}:${OAUTH_INTERNAL_API_PORT}"
      - "${OAUTH_EXTERNAL_DEBUG_PORT}:${OAUTH_INTERNAL_DEBUG_PORT}"
      - "${OAUTH_EXTERNAL_METRICS_PORT}:${OAUTH_INTERNAL_METRICS_PORT}"
    networks:
      - constrsw
    depends_on:
      keycloak:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://127.0.0.1:'+(process.env.OAUTH_INTERNAL_API_PORT)+'/health',(r)=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: always

  # PostgreSQL — banco do contexto resources
  resources-db:
    container_name: resources-db
    image: postgres:15
    environment:
      - POSTGRES_DB=${RESOURCES_DB_NAME}
      - POSTGRES_USER=${RESOURCES_DB_USER}
      - POSTGRES_PASSWORD=${RESOURCES_DB_PASSWORD}
    volumes:
      - constrsw-resources-data:/var/lib/postgresql/data
      - ./backend/resources/db/init:/docker-entrypoint-initdb.d:ro
    networks:
      - constrsw
    ports:
      - "${RESOURCES_DB_EXTERNAL_PORT}:${RESOURCES_DB_INTERNAL_PORT}"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: always

  # API REST — contexto resources
  resources:
    container_name: resources
    build:
      context: ./backend/resources
      dockerfile: Dockerfile
    image: constrsw/resources
    environment:
      - PORT=${RESOURCES_INTERNAL_API_PORT}
      - NODE_ENV=development
      - DATABASE_URL=postgresql://${RESOURCES_DB_USER}:${RESOURCES_DB_PASSWORD}@resources-db:${RESOURCES_DB_INTERNAL_PORT}/${RESOURCES_DB_NAME}
      - DB_SSL=false
      - KEYCLOAK_JWKS_URL=http://keycloak:8080/realms/${KEYCLOAK_REALM}/protocol/openid-connect/certs
      - KEYCLOAK_ISSUER=http://keycloak:8080/realms/${KEYCLOAK_REALM}
      - JWT_AUDIENCE=oauth
      - READ_ROLES=${RESOURCES_READ_ROLES}
      - WRITE_ROLES=${RESOURCES_WRITE_ROLES}
      - REQUIRE_EMPLOYEE_IDENTITY=false
      - SERVICE_NAME=resources
    networks:
      - constrsw
    ports:
      - "${RESOURCES_EXTERNAL_API_PORT}:${RESOURCES_INTERNAL_API_PORT}"
    depends_on:
      resources-db:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:'+(process.env.PORT||8106)+'/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: always
