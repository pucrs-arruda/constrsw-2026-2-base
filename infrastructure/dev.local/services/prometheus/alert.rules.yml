# Regras de alerta - visiveis em http://localhost:9090/alerts
groups:
  - name: disponibilidade
    rules:
      - alert: OAuthApiDown
        expr: up{job="oauth"} == 0
        for: 30s
        labels:
          severity: critical
        annotations:
          summary: "API oauth fora do ar"
          description: "O Prometheus nao consegue coletar oauth:9464/actuator/prometheus ha mais de 30s."

      - alert: KeycloakDown
        expr: up{job="keycloak"} == 0
        for: 30s
        labels:
          severity: critical
        annotations:
          summary: "Keycloak fora do ar"
          description: "O Prometheus nao consegue coletar keycloak:9001/metrics ha mais de 30s."

  - name: desempenho
    rules:
      - alert: OAuthApiHighLatency
        expr: |
          histogram_quantile(0.95,
            sum by (le) (rate(http_server_requests_seconds_bucket{job="oauth", uri!~"/actuator.*"}[5m]))
          ) > 1
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "Latencia p95 da API oauth acima de 1s"

      - alert: OAuthApiServerErrors
        expr: |
          sum(rate(http_server_requests_seconds_count{job="oauth", status=~"5.."}[5m])) > 0
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "API oauth respondendo 5xx"
