global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - "alerts.yml"
  - "recording_rules.yml"

scrape_configs:
  # Prometheus próprio
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # OpenTelemetry Collector
  - job_name: 'otel-collector'
    static_configs:
      - targets: ['otel-collector:8889']
    metrics_path: '/metrics'
    scrape_interval: 10s

  # OAuth gateway (NestJS — prom-client)
  - job_name: 'oauth'
    static_configs:
      - targets: ['oauth:3001']
    metrics_path: '/metrics'
    scrape_interval: 10s

  # Resources Service (NestJS — prom-client)
  - job_name: 'resources'
    static_configs:
      - targets: ['resources:8106']
    metrics_path: '/metrics'
    scrape_interval: 10s

  # Keycloak (métricas expostas na porta de management)
  - job_name: 'keycloak'
    static_configs:
      - targets: ['keycloak:9001']
    metrics_path: '/metrics'
    scrape_interval: 30s

  # Health Checks via Blackbox Exporter — apenas containers deste compose.
  - job_name: 'health-checks'
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
        - http://keycloak:9001/health/ready
        - http://oauth:3001/health
        - http://resources:8106/health/ready
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115
    scrape_interval: 30s

  # ---------------------------------------------------------------------------
  # Demais contextos do monorepo: não são definidos no docker-compose.yml deste
  # repositório. Descomente o job (e o alvo do blackbox) quando o container
  # correspondente estiver rodando, senão o Prometheus/blackbox registra
  # "no such host"/"server misbehaving" a cada scrape.
