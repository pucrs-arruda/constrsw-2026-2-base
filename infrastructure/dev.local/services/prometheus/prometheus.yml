# Prometheus - coleta de metricas do ConstrSW (dev.local)
# Os alvos usam os nomes dos servicos na network "constrsw" do docker-compose.
global:
  scrape_interval: 10s
  evaluation_interval: 10s

rule_files:
  - /etc/prometheus/alert.rules.yml

scrape_configs:
  # O proprio Prometheus
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # API oauth (Spring Boot Actuator na porta de metricas OAUTH_INTERNAL_METRICS_PORT)
  - job_name: oauth
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["oauth:9464"]
        labels:
          service: oauth-api

  # Keycloak (management interface KC_HTTP_MANAGEMENT_PORT, requer KC_METRICS_ENABLED=true)
  - job_name: keycloak
    metrics_path: /metrics
    static_configs:
      - targets: ["keycloak:9001"]
        labels:
          service: keycloak
