global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - "alerts.yml"
  - "recording_rules.yml"

scrape_configs:
  # Prometheus próprio
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # OpenTelemetry Collector
  - job_name: 'otel-collector'
    static_configs:
      - targets: ['otel-collector:8889']
    metrics_path: '/metrics'
    scrape_interval: 10s

  # OAuth Service (NestJS — prom-client, na porta da API)
  - job_name: 'oauth'
    static_configs:
      - targets: ['oauth:8088']
    metrics_path: '/metrics'
    scrape_interval: 10s

  # Keycloak (métricas expostas na porta de management)
  - job_name: 'keycloak'
    static_configs:
      - targets: ['keycloak:9001']
    metrics_path: '/metrics'
    scrape_interval: 30s

  # Health Checks via Blackbox Exporter
  - job_name: 'health-checks'
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
        - http://oauth:8088/health
        - http://keycloak:9001/health/ready
        # Ainda fora do docker-compose.yml — descomente junto com o job do serviço (abaixo)
        # - http://courses:8080/api/v1/health
        # - http://professors:3002/health
        # - http://lessons:3000/api/v1/health
        # - http://reservations:8080/api/v1/health
        # - http://resources:3000/api/v1/health
        # - http://rooms:3000/api/v1/health
        # - http://students:8080/api/v1/health
        # - http://employees:8080/health
        # - http://classes:8080/api/v1/health
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115
    scrape_interval: 30s

  # ---------------------------------------------------------------------------
  # Serviços que ainda não estão no docker-compose.yml. Enquanto não existem, o
  # Prometheus não resolve o host ("no such host") e o alvo aparece como down.
  # Ao adicionar um serviço ao compose, descomente o job dele e o alvo de health
  # check correspondente acima. Os alertas já estão em alerts.yml.
  # ---------------------------------------------------------------------------

