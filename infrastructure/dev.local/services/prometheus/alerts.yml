          description: "O endpoint de health check do servi?o Professors est? retornando erro"

      - alert: LessonsHealthCheckFailed
        expr: probe_success{job="health-checks",instance=~".*lessons.*"} == 0
        for: 1m
        labels:
          severity: critical
          service: lessons
        annotations:
          summary: "Health check do Lessons falhou"
          description: "O endpoint de health check do servi?o Lessons est? retornando erro"

      - alert: ReservationsHealthCheckFailed
        expr: probe_success{job="health-checks",instance=~".*reservations.*"} == 0
        for: 1m
        labels:
          severity: critical
          service: reservations
        annotations:
          summary: "Health check do Reservations falhou"
          description: "O endpoint de health check do servi?o Reservations est? retornando erro"

      - alert: ResourcesHealthCheckFailed
        expr: probe_success{job="health-checks",instance=~".*resources.*"} == 0
        for: 1m
        labels:
          severity: critical
          service: resources
        annotations:
          summary: "Health check do Resources falhou"
          description: "O endpoint de health check do servi?o Resources est? retornando erro"

      - alert: RoomsHealthCheckFailed
        expr: probe_success{job="health-checks",instance=~".*rooms.*"} == 0
        for: 1m
        labels:
          severity: critical
          service: rooms
        annotations:
          summary: "Health check do Rooms falhou"
          description: "O endpoint de health check do servi?o Rooms est? retornando erro"

      - alert: StudentsHealthCheckFailed
        expr: probe_success{job="health-checks",instance=~".*students.*"} == 0
        for: 1m
        labels:
          severity: critical
          service: students
        annotations:
          summary: "Health check do Students falhou"
          description: "O endpoint de health check do servi?o Students est? retornando erro"

      - alert: EmployeesHealthCheckFailed
        expr: probe_success{job="health-checks",instance=~".*employees.*"} == 0
        for: 1m
        labels:
          severity: critical
