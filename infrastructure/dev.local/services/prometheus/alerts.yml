          description: "O endpoint de health check do servi?o Employees est? retornando erro"

      - alert: ClassesHealthCheckFailed
        expr: probe_success{job="health-checks",instance=~".*classes.*"} == 0
        for: 1m
        labels:
          severity: critical
          service: classes
        annotations:
          summary: "Health check do Classes falhou"
          description: "O endpoint de health check do servi?o Classes est? retornando erro"